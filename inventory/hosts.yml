---
# 這個 inventory 只給「從別台機器遠端管」用，也就是 `make install LOCAL=0`。
# 預設不是這條：在這台直接 `make install`（LOCAL 預設 1，走 `-i localhost, -c local`，
# 根本不讀這個檔）。
#
# ansible_host 填控制端連得到這台的位址（Tailscale 的 MagicDNS 名稱）。
all:
  hosts:
    mac:
      ansible_host: macbook-pro      # TODO: 換成 Tailscale 的 MagicDNS 名稱
      ansible_user: miskawu
