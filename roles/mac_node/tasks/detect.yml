---
# 這個 role 只支援 Apple silicon 的 macOS。不是就在第一步停下，不要往下改東西。
- name: 確認是 Apple silicon 的 macOS
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Darwin'
      - ansible_facts.architecture == 'arm64'
    fail_msg: "只支援 Apple silicon 的 macOS（現在是 {{ ansible_facts.system }} / {{ ansible_facts.architecture }}）"
    quiet: true

# uid / user 用 facts，不另外跑 `id -u`（同 dev-env-ansible）。
- name: 環境摘要
  ansible.builtin.debug:
    msg: >-
      host={{ inventory_hostname }} macOS={{ ansible_facts.distribution_version }}
      arch={{ ansible_facts.architecture }} user={{ ansible_facts.user_id }}
      uid={{ ansible_facts.user_uid }} home={{ mac_node_home }}
