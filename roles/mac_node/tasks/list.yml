---
# make list：有哪些項目、這台已經有哪些。唯讀，什麼都不改。
# ✓ / · 是當場 stat 出來的，不是文件裡的宣稱。
# 往 main-user.yml / main-system.yml 加一個 import 時，回這裡補一行。
- name: 偵測
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { tag: tmux,            path: "{{ mac_node_tmux_bin }}",                                                   desc: "tmux（Remote Control 伺服器的終端機）" }
    - { tag: claude,          path: "{{ mac_node_claude_bin }}",                                                 desc: "Claude Code CLI" }
    - { tag: claude-desktop,  path: /Applications/Claude.app,                                                    desc: "Claude Desktop（沒裝才用 brew cask 裝；移除手動）" }
    - { tag: chrome,          path: "/Applications/Google Chrome.app",                                           desc: "Google Chrome（沒裝才用 brew cask 裝；移除手動）" }
    - { tag: chrome-remote-desktop, path: /Library/PrivilegedHelperTools/ChromeRemoteDesktopHost.app,            desc: "Chrome 遠端桌面主機（.pkg，安裝與移除都手動）" }
    - { tag: tailscale,       path: /Applications/Tailscale.app,                                                 desc: "Tailscale GUI 版（登入手動）" }
    - { tag: git-identity,    path: "{{ mac_node_home }}/.gitconfig",                                            desc: "全域 git 身分" }
    - { tag: ssh-keys,        path: "{{ mac_node_home }}/.ssh/id_ed25519_{{ ssh_key_tag }}_{{ ssh_key_scopes | first | default('github') }}", desc: "對外用的 SSH key 與 ~/.ssh/config" }
    - { tag: authorized-keys, path: "{{ mac_node_home }}/.ssh/authorized_keys",                                  desc: "允許登入這台的公鑰" }
    - { tag: arrive-home,     path: "{{ mac_node_home }}/bin/arrive-home.sh",                                    desc: "到家就緒腳本" }
    - { tag: go,              path: "{{ mac_node_brew_prefix }}/bin/go",                                         desc: "Go（brew；專案版本由 go.mod 的 toolchain 宣告）" }
    - { tag: python,          path: "{{ mac_node_brew_prefix }}/bin/uv",                                         desc: "uv（brew；主機不裝 Python，一律 uv run）" }
    - { tag: node,            path: "{{ mac_node_home }}/.local/node-{{ node_version }}/bin/node",               desc: "Node {{ node_version }}（官方 tarball → ~/.local/node）" }
    - { tag: pnpm,            path: "{{ mac_node_brew_prefix }}/bin/pnpm",                                       desc: "pnpm（brew；globalShims 關）" }
    - { tag: rust,            path: "{{ mac_node_home }}/.cargo/bin/rustup",                                     desc: "Rust（官方 rustup，~/.rustup、~/.cargo）" }
    - { tag: podman,          path: "{{ mac_node_brew_prefix }}/bin/podman",                                     desc: "podman（brew；machine 只建不啟動）" }
    - { tag: docker-compat,   path: "{{ mac_node_home }}/.local/bin/docker",                                     desc: "Docker 相容（podman compose 用 docker-compose；docker → podman）" }
    - { tag: godot,           path: "{{ mac_node_home }}/.local/bin/godot",                                      desc: "Godot {{ godot_versions | join('、') }}（官方 build，多版本並存）" }
    - { tag: codex,           path: "{{ mac_node_codex_pkg_dir }}/bin/codex-code-mode-host",                     desc: "Codex CLI {{ codex_version }}（官方完整套件 → ~/.local/codex-<版本>，~/.local/bin/codex 連過去；easel 生圖用，登入手動：codex login）" }
    - { tag: chrome-headless-shell, path: "{{ mac_node_chs_dir }}/chrome-headless-shell",                         desc: "chrome-headless-shell {{ chrome_headless_shell_version }}（Chrome for Testing → ~/.local/chrome-headless-shell-<版本>，~/.local/bin 放轉接腳本；jury 拍 390 寬手機截圖用）" }
    - { tag: bash,            path: "{{ mac_node_brew_prefix }}/bin/bash",                                      desc: "bash 5（brew；PATH 上排在 /bin/bash 3.2 前面）" }
    - { tag: awscli,          path: "{{ mac_node_brew_prefix }}/bin/aws",                                        desc: "AWS CLI v2（brew；登入手動：aws configure sso）" }
    - { tag: just,            path: "{{ mac_node_brew_prefix }}/bin/just",                                       desc: "just（brew；每個專案的入口指令）" }
    - { tag: gh,              path: "{{ mac_node_brew_prefix }}/bin/gh",                                         desc: "GitHub CLI（brew；登入手動：gh auth login）" }
    - { tag: claude-guard,    path: "{{ mac_node_claude_managed_dir }}/managed-settings.d/mac-bootstrap.json", desc: "要裝東西先問（sudo；整台電腦層的 permissions.ask）" }
    - { tag: claude-md,       path: "{{ mac_node_claude_managed_dir }}/CLAUDE.md",                               desc: "這台的規矩（sudo；整台電腦層的 CLAUDE.md）" }
    - { tag: profile,         path: "{{ mac_node_home }}/.config/mac-bootstrap/env.zsh",                         desc: "PATH（~/.zshenv 與 ~/.zprofile 各 source 一次）" }
    - { tag: claude-rc,       path: "{{ mac_node_home }}/Library/LaunchAgents/{{ claude_rc_label }}.plist",     desc: "Remote Control 常駐伺服器（LaunchAgent + tmux）" }
    - { tag: hostname,        path: /dev/null,                                                                    desc: "主機名稱（sudo；設定類，看 make verify）" }
    - { tag: power,           path: /dev/null,                                                                    desc: "接電源永不睡眠（sudo；設定類，看 make verify）" }
    - { tag: softwareupdate,  path: /dev/null,                                                                    desc: "關掉自動安裝 macOS 更新（sudo；設定類，看 make verify）" }
    - { tag: sshd,            path: /etc/ssh/sshd_config.d/010-hardening.conf,                                    desc: "sshd 只允許金鑰登入（sudo）" }
  loop_control:
    label: "{{ item.tag }}"
  register: _list
  check_mode: false

- name: 項目一覽
  ansible.builtin.debug:
    msg: |-
      ✓ = 這台已經有   · = 還沒有   ○ = 設定類，狀態看 make verify
      {% for r in _list.results %}
      {{ '○' if r.item.path == '/dev/null' else ('✓' if r.stat.exists else '·') }} {{ '%-16s' | format(r.item.tag) }} {{ r.item.desc }}
      {% endfor %}
