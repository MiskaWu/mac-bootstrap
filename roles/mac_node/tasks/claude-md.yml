---
# ~/.claude/CLAUDE.md 裡的一個 managed block：這台機器上每個 Claude 工作階段（包括從手機
# 經 Remote Control 開的）都會讀到的規矩。只管這一塊，檔案其餘部分是 Miska 自己的。
# 只確保存在、不管權限：~/.claude 是 Claude Code 自己的目錄，權限由它決定。
- name: ~/.claude
  ansible.builtin.file:
    path: "{{ mac_node_home }}/.claude"
    state: directory

# 內容看機器上實際有什麼（同 profile）：裝了才寫那一段，移除後重生就會拿掉。
- name: 偵測要寫進規矩的項目
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ mac_node_home }}/.local/bin/docker"
    - "{{ mac_node_home }}/.local/bin/godot"
  register: _claude_md_probe
  check_mode: false

- name: 整理偵測結果
  ansible.builtin.set_fact:
    mac_node_have_docker_compat: "{{ _claude_md_probe.results[0].stat.exists }}"
    mac_node_have_godot: "{{ _claude_md_probe.results[1].stat.exists }}"

- name: ~/.claude/CLAUDE.md 的 managed block
  ansible.builtin.blockinfile:
    path: "{{ mac_node_home }}/.claude/CLAUDE.md"
    create: true
    mode: "0644"
    marker: "<!-- {mark} mac-bootstrap (managed) -->"
    block: "{{ lookup('ansible.builtin.template', 'claude-md.j2') }}"
