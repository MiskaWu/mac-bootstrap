---
# user 層：不用 sudo。每個 import 掛 [user, <自己>]，相依用 tag 表達（同 dev-env-ansible）：
#
#   tmux.yml    [user, tmux, claude-rc]     ← claude-rc 要 tmux
#   claude.yml  [user, claude, claude-rc]   ← claude-rc 要 claude
#   profile.yml [user, profile, tmux, claude, claude-rc]  ← 影響 PATH 的都帶 profile
#
# 加東西的規矩：(1) 給它自己的 tag 並掛 user；(2) 它需要什麼，就把它的 tag 掛到那些
# 前置的 import 上；(3) 影響 PATH 就把 tag 加到 profile 那行；(4) 回 list.yml 補一行；
# (5) 裝 brew 套件就回 defaults 的 mac_node_brew_allowed_* 補一行。

- name: 偵測環境
  ansible.builtin.import_tasks: detect.yml
  tags: always

# 只給 make list / make verify 用，什麼都不改。never 讓一般 install 掃不到。
- name: 項目一覽（唯讀）
  ansible.builtin.import_tasks: list.yml
  tags: [list, never]

- name: 驗收（唯讀）
  ansible.builtin.import_tasks: verify.yml
  tags: [verify, never]

# ---- 可安裝的項目 ------------------------------------------------------------
- name: tmux
  ansible.builtin.import_tasks: tmux.yml
  tags: [user, tmux, claude-rc]

- name: Claude Code CLI
  ansible.builtin.import_tasks: claude.yml
  tags: [user, claude, claude-rc]

- name: Tailscale（GUI 版）
  ansible.builtin.import_tasks: tailscale.yml
  tags: [user, tailscale]

# ---- GUI App：確認在，不在才裝（cask-app.yml）。已經裝著的不動；移除是手動的事。----
- name: Claude Desktop
  ansible.builtin.import_tasks: cask-app.yml
  vars: { _app_name: "Claude Desktop", _app_path: /Applications/Claude.app, _app_cask: claude, _app_pkg: false }
  tags: [user, claude-desktop]

- name: Google Chrome
  ansible.builtin.import_tasks: cask-app.yml
  vars: { _app_name: "Google Chrome", _app_path: "/Applications/Google Chrome.app", _app_cask: google-chrome, _app_pkg: false }
  tags: [user, chrome]

# 補救用的遠端通道（從外面過登入畫面）。.pkg，要 sudo，只檢查。
- name: Chrome 遠端桌面主機
  ansible.builtin.import_tasks: cask-app.yml
  vars: { _app_name: "Chrome 遠端桌面主機", _app_path: /Library/PrivilegedHelperTools/ChromeRemoteDesktopHost.app, _app_cask: chrome-remote-desktop-host, _app_pkg: true }
  tags: [user, chrome-remote-desktop]

- name: git 身分
  ansible.builtin.import_tasks: git-identity.yml
  tags: [user, git-identity]

- name: 對外用的 SSH key
  ansible.builtin.import_tasks: ssh-keys.yml
  tags: [user, ssh-keys]

- name: 允許登入這台的公鑰
  ansible.builtin.import_tasks: authorized-keys.yml
  tags: [user, authorized-keys]

- name: 到家就緒腳本
  ansible.builtin.import_tasks: arrive-home.yml
  tags: [user, arrive-home]

# ---- 語言與容器（research/language-versions.md）-----------------------------
# 每一項都有 make uninstall（uninstall.yml）。這裡加一項，那邊也要加。
- name: Go（brew）
  ansible.builtin.import_tasks: go.yml
  tags: [user, go]

- name: Python（uv，brew；主機不裝 Python）
  ansible.builtin.import_tasks: python.yml
  tags: [user, python]

- name: Node（官方 tarball，pin 版本）
  ansible.builtin.import_tasks: node.yml
  tags: [user, node]

- name: pnpm（brew）
  ansible.builtin.import_tasks: pnpm.yml
  tags: [user, pnpm]

- name: Rust（官方 rustup）
  ansible.builtin.import_tasks: rust.yml
  tags: [user, rust]

- name: podman（brew，machine 只建不啟動）
  ansible.builtin.import_tasks: podman.yml
  tags: [user, podman, docker-compat]

- name: Docker 相容（podman compose 的 provider、docker → podman 的 shim）
  ansible.builtin.import_tasks: docker-compat.yml
  tags: [user, docker-compat]

- name: Godot（官方 build，多版本並存）
  ansible.builtin.import_tasks: godot.yml
  tags: [user, godot]

# ---- easel 的前置工具（github.com/MiskaWu/easel）------------------------------
# easel 直接在主機上呼叫 codex 生圖；縮圖在 macOS 用內建的 sips，所以只需要 codex。
# 掛在 profile 那行：codex 在 ~/.local/bin，要靠 env.zsh 把它放進 PATH。
- name: Codex CLI（官方 release，pin 版本與 sha256）
  ansible.builtin.import_tasks: codex.yml
  tags: [user, codex]

# ---- 無頭截圖（jury 的手機截圖）-----------------------------------------------
# jury 的 scripts/headless-chrome.sh 在 PATH 上找 chrome-headless-shell。一般 Google Chrome 的無頭模式
# 最窄 500，390 寬的手機截圖會被切掉，所以另外裝這個（理由見 tasks/chrome-headless-shell.yml 檔頭）。
# 掛在 profile 那行：它在 ~/.local/bin，要靠 env.zsh 把它放進 PATH。
- name: chrome-headless-shell（Chrome for Testing，pin 版本與 sha256）
  ansible.builtin.import_tasks: chrome-headless-shell.yml
  tags: [user, chrome-headless-shell]

# ---- 命令列工具（brew）--------------------------------------------------------
# 專案腳本要用、又沒有「專案自己宣告版本」機制的工具。都掛在 profile 那行：bash 5 要靠
# env.zsh 把 /opt/homebrew/bin 排在 /bin 前面才蓋得過 /bin/bash 3.2。
- name: bash 5（brew；靠 PATH 順序蓋過 /bin/bash 3.2）
  ansible.builtin.import_tasks: bash.yml
  tags: [user, bash]

- name: AWS CLI v2（brew）
  ansible.builtin.import_tasks: awscli.yml
  tags: [user, awscli]

- name: GitHub CLI（brew）
  ansible.builtin.import_tasks: gh.yml
  tags: [user, gh]

- name: just（brew；專案的入口指令）
  ansible.builtin.import_tasks: just.yml
  tags: [user, just]

# ---- 收尾 -------------------------------------------------------------------
# profile 放在 claude-rc 前面：伺服器啟動時 PATH 必須已經對。
# 內容看機器上實際有什麼（stat），不看開關。
- name: PATH 環境設定（~/.zshenv + ~/.zprofile）
  ansible.builtin.import_tasks: profile.yml
  tags: [user, profile, tmux, claude, claude-rc, go, python, node, pnpm, rust, podman, docker-compat, godot, codex, chrome-headless-shell, bash, awscli, gh]

- name: Remote Control 常駐伺服器
  ansible.builtin.import_tasks: claude-rc.yml
  tags: [user, claude-rc]
