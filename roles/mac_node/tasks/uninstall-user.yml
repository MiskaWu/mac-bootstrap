---
# user 層的移除（make uninstall TAGS=<項目>；DATA=1 連資料一起清）。同 dev-env-ansible 的設計：
#
#   1. **必須點名 TAGS，不帶就拒絕**（Makefile 的 _check-uninstall-tags）。install 不帶 TAGS 是
#      「全裝」，uninstall 不帶 TAGS 是「拒絕」—— 這個指令沒有「全砍」的意思。
#   2. **工具與資料分開**：預設只移除工具本身；快取、下載的 runtime、VM 磁碟留著並報告大小，
#      加 DATA=1 才刪。你的東西（~/.claude、cargo 的 config/credentials、私鑰）DATA=1 也不動。
#   3. **沒有 uninstall 的乾跑**：--check 對「移除」只會說「會 changed」，講不出連帶後果，
#      給的是假的安全感。安全靠 1、2 和下面每一項的防呆。
#
# 順序是安裝的**反向**：先拆用到別人的（claude-rc 用 claude 和 tmux），最後拆 profile。
# brew 裝的項目：brew 在還有別的套件依賴它時會拒絕移除，所以可以自動化（Linux 的 apt 不行）。
# 拆完再 `brew autoremove` 帶走只被它需要的相依（例如 podman 的 krunkit）。
#
# 加一個新項目時：給它一個跟 install 端同名的 tag、移除工具、把資料路徑登記到
# `_uninstall_data`（DATA=1 會刪）或 `_uninstall_keep`（永遠保留，只報告）。

- name: 準備累加器
  ansible.builtin.set_fact:
    _uninstall_done: []
    _uninstall_data: []
    _uninstall_keep: []
    _uninstall_brew: false
    # 收尾時「空了就刪」的目錄（rmdir，不空就留著）：例如 ~/.cargo 拆完只剩空殼。
    _uninstall_rmdir: []
    _u_home: "{{ mac_node_home }}"
    _u_plist: "{{ mac_node_home }}/Library/LaunchAgents/{{ claude_rc_label }}.plist"
  tags: always

# ---- Remote Control 常駐伺服器 ----------------------------------------------
- name: Remote Control 常駐伺服器
  tags: [claude-rc]
  block:
    - name: claude-rc —— 說明
      ansible.builtin.debug:
        msg: >-
          停掉 Remote Control：手機 / claude.ai/code 上這台的工作階段會全部結束。
          要重新裝回來：make install TAGS=claude-rc。

    - name: 讀 LaunchAgent 狀態
      ansible.builtin.command:
        argv: [/bin/launchctl, print, "gui/{{ ansible_facts.user_uid }}/{{ claude_rc_label }}"]
      register: _u_rc_loaded
      changed_when: false
      failed_when: false

    - name: 卸載 LaunchAgent
      ansible.builtin.command:
        argv: [/bin/launchctl, bootout, "gui/{{ ansible_facts.user_uid }}/{{ claude_rc_label }}"]
      changed_when: true
      when: _u_rc_loaded.rc == 0

    # Remote Control 在 tmux 裡跑；session 關掉，迴圈和 claude 一起結束（SIGHUP）。
    - name: 關掉 tmux session
      ansible.builtin.command:
        argv: ["{{ mac_node_tmux_bin }}", kill-session, -t, "={{ claude_rc_session }}"]
      register: _u_rc_kill
      changed_when: _u_rc_kill.rc == 0
      failed_when: false

    - name: 刪 plist 與啟動腳本
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _u_plist }}"
        - "{{ _u_home }}/bin/claude-rc-server.sh"
        - "{{ _u_home }}/bin/claude-rc-entry"

    - name: claude-rc —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['claude-rc'] }}"
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ claude_rc_log_dir }}/claude-rc.log"
            what: Remote Control 的啟動紀錄
          - path: "{{ claude_rc_log_dir }}/claude-rc.err.log"
            what: Remote Control 的錯誤紀錄

# ---- 到家就緒腳本 ------------------------------------------------------------
- name: 到家就緒腳本
  tags: [arrive-home]
  block:
    - name: 刪 ~/bin/arrive-home.sh
      ansible.builtin.file:
        path: "{{ _u_home }}/bin/arrive-home.sh"
        state: absent

    - name: arrive-home —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['arrive-home'] }}"

# ---- 允許登入這台的公鑰 ------------------------------------------------------
- name: 允許登入這台的公鑰
  tags: [authorized-keys]
  block:
    - name: 讀 sshd 硬化設定
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/010-hardening.conf
      register: _u_hardening

    # 只收金鑰時拿掉公鑰 = 從別台再也登不進來（本機螢幕前還可以）。先移除 sshd 那項。
    - name: 防呆：sshd 只收金鑰時不拿掉公鑰
      ansible.builtin.assert:
        that: not _u_hardening.stat.exists
        fail_msg: >-
          sshd 目前只收金鑰（010-hardening.conf 還在），拿掉公鑰就再也不能從別台登入。
          要整個還原，先 make uninstall TAGS=sshd（會問密碼），再移除這項。
        quiet: true

    - name: 拿掉 config.yml 裡列的公鑰
      ansible.posix.authorized_key:
        user: "{{ ansible_facts.user_id }}"
        key: "{{ item }}"
        state: absent
      loop: "{{ ssh_authorized_keys }}"
      loop_control:
        label: "{{ item.split(' ')[2] | default(item[:30]) }}"

    - name: authorized-keys —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['authorized-keys'] }}"

# ---- 對外用的 SSH key --------------------------------------------------------
- name: 對外用的 SSH key
  tags: [ssh-keys]
  block:
    - name: 拿掉 ~/.ssh/config 的 managed block
      ansible.builtin.blockinfile:
        path: "{{ _u_home }}/.ssh/config"
        marker: "# {mark} mac-bootstrap ssh-keys (managed)"
        state: absent

    # 私鑰不自動刪，DATA=1 也不刪：公鑰可能還登記在 GitHub 上，刪了就再也無法用它，
    # 而且刪錯沒有退路。要刪就先到 GitHub 拿掉公鑰，再自己刪檔。
    - name: ssh-keys —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['ssh-keys'] }}"
        _uninstall_keep: "{{ _uninstall_keep + _k }}"
      vars:
        _k: >-
          {{ ssh_key_scopes | map('regex_replace', '^(.*)$',
               _u_home ~ '/.ssh/id_ed25519_' ~ ssh_key_tag ~ '_\1')
             | map('community.general.dict_kv', 'path')
             | map('combine', {'what': '私鑰（先到 GitHub 等處拿掉公鑰，再自己刪；DATA=1 也不會動）'}) | list }}

# ---- git 身分 ----------------------------------------------------------------
- name: git 身分
  tags: [git-identity]
  block:
    - name: 拿掉全域 user.name / user.email
      community.general.git_config:
        name: "{{ item }}"
        scope: global
        state: absent
      loop: [user.name, user.email]

    - name: git-identity —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['git-identity'] }}"

# ---- 命令列工具：gh、AWS CLI、bash --------------------------------------------
# 登入狀態照 ssh-keys 私鑰的保守做法：**設定與長期的秘密永遠不自動刪，DATA=1 也不刪**。
# 理由同私鑰：刪本機的檔不會讓對方那邊的授權失效（GitHub 上的 OAuth 授權、IAM 的 access key
# 照樣有效），只會少掉「這台登入過什麼」的線索，而且刪錯沒有退路。要清就先到對方撤銷，再自己刪。
# DATA=1 只刪「重新登入就會再生」的暫時 token 與快取：它們本來就會過期，刪掉的代價只是再登入一次。
# 不在這裡跑 gh auth logout / aws sso logout：那是帳號端的動作（會呼叫 GitHub / AWS），由你決定。
- name: just
  tags: [just]
  block:
    - name: brew uninstall just
      community.general.homebrew:
        name: just
        state: absent

    - name: just —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['just'] }}"
        _uninstall_brew: true

- name: GitHub CLI
  tags: [gh]
  block:
    - name: brew uninstall gh
      community.general.homebrew:
        name: gh
        state: absent

    - name: gh —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['gh'] }}"
        _uninstall_brew: true
        _uninstall_data: "{{ _uninstall_data + _d }}"
        _uninstall_keep: "{{ _uninstall_keep + _k }}"
      vars:
        _d:
          - path: "{{ _u_home }}/.local/share/gh"
            what: gh extension install 裝的擴充（gh 的全域安裝）
          - path: "{{ _u_home }}/.local/state/gh"
            what: gh 的狀態檔（檢查更新的時間）
          - path: "{{ _u_home }}/.cache/gh"
            what: gh 的 API 快取
        _k:
          - path: "{{ _u_home }}/.config/gh"
            what: gh 的設定與登入紀錄（token 在鑰匙圈的 gh:github.com，鑰匙圈不能用時在 hosts.yml）—— DATA=1 也不會動。要清：先到 GitHub 的 Settings → Applications 撤銷 GitHub CLI，再自己刪這個目錄與鑰匙圈項目

- name: AWS CLI
  tags: [awscli]
  block:
    - name: brew uninstall awscli
      community.general.homebrew:
        name: awscli
        state: absent

    # rmdir 只收空目錄：DATA=1 刪掉快取後 sso/、cli/ 通常空了；~/.aws 還有 config 就留著。
    - name: awscli —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['awscli'] }}"
        _uninstall_brew: true
        _uninstall_data: "{{ _uninstall_data + _d }}"
        _uninstall_keep: "{{ _uninstall_keep + _k }}"
        _uninstall_rmdir: "{{ _uninstall_rmdir + [_u_home ~ '/.aws/sso', _u_home ~ '/.aws/cli', _u_home ~ '/.aws'] }}"
      vars:
        _d:
          - path: "{{ _u_home }}/.aws/sso/cache"
            what: aws sso login 拿到的暫時 token（會自己過期；刪了只是要重新登入）
          - path: "{{ _u_home }}/.aws/cli/cache"
            what: 用 SSO 換來的暫時憑證（會自己過期；刪了只是要重新登入）
        _k:
          - path: "{{ _u_home }}/.aws/config"
            what: 你的 profile 與 SSO 設定（aws configure sso 寫的）—— DATA=1 也不會動
          - path: "{{ _u_home }}/.aws/credentials"
            what: 長期的 access key —— DATA=1 也不會動。要清：先到 IAM 停用或刪掉那把 key，再自己刪

- name: bash（brew）
  tags: [bash]
  block:
    # 登入 shell 指到 brew 的 bash 時把它移掉，終端機與 ssh 都會開不起來（同 authorized-keys 的防鎖死）。
    # 這個 repo 不會這樣設（bash.yml 不 chsh），防的是手動改過的情況。
    - name: 防呆：登入 shell 是 brew 的 bash 就不移除
      ansible.builtin.assert:
        that: not (ansible_facts.user_shell.startswith(mac_node_brew_prefix ~ '/') and ansible_facts.user_shell.endswith('/bash'))
        fail_msg: >-
          登入 shell 是 {{ ansible_facts.user_shell }}，移除後終端機與 ssh 都開不起來。
          先 chsh -s /bin/zsh，再移除。bash 沒有動。
        quiet: true

    - name: brew uninstall bash
      community.general.homebrew:
        name: bash
        state: absent

    # 沒有自己的資料：~/.bash_history、~/.bashrc 跟 /bin/bash 3.2 共用，不是這個 tag 的。
    - name: bash —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['bash'] }}"
        _uninstall_brew: true

# ---- chrome-headless-shell ---------------------------------------------------
# 工具本體是 ~/.local/chrome-headless-shell-<版本>（整包）加 ~/.local/bin/chrome-headless-shell 這支轉接腳本
#（exec 到版本目錄裡的執行檔），兩個都刪。沒有自己的資料：截圖腳本每次用 --user-data-dir 給一個用完就刪的
# 暫存設定檔，所以沒有 DATA=1 要刪的東西，也沒有要保留的東西。
- name: chrome-headless-shell
  tags: [chrome-headless-shell]
  block:
    - name: ~/.local/bin/chrome-headless-shell 是什麼
      ansible.builtin.stat:
        path: "{{ _u_home }}/.local/bin/chrome-headless-shell"
      register: _u_chs_bin

    # 只刪自己放的：帶標記（mac_node_chs_marker）的一般檔案。只比對不含版本的前半，哪一版放的都認得。
    # 沒有標記的檔案、symlink 都留著並報告。
    - name: 有沒有這裡放的標記
      ansible.builtin.command:
        argv: [/usr/bin/grep, -qF, "{{ mac_node_chs_marker }} ", "{{ _u_home }}/.local/bin/chrome-headless-shell"]
      register: _u_chs_marker
      changed_when: false
      failed_when: false
      when: _u_chs_bin.stat.exists and (_u_chs_bin.stat.isreg | default(false))

    - name: ~/.local/bin/chrome-headless-shell 是不是這裡放的
      ansible.builtin.set_fact:
        _u_chs_ours: "{{ (_u_chs_marker.rc | default(1)) == 0 }}"

    - name: 刪 ~/.local/bin/chrome-headless-shell
      ansible.builtin.file:
        path: "{{ _u_home }}/.local/bin/chrome-headless-shell"
        state: absent
      when: _u_chs_ours | bool

    - name: 不是這裡放的就不動
      ansible.builtin.debug:
        msg: >-
          ~/.local/bin/chrome-headless-shell 是{{ ('symlink（→ ' ~ (_u_chs_bin.stat.lnk_target | default('?')) ~ '）') if (_u_chs_bin.stat.islnk | default(false)) else '沒有 mac-bootstrap 標記的檔案' }}，
          不是 mac-bootstrap 放的，沒有刪。
      when: _u_chs_bin.stat.exists and not (_u_chs_ours | bool)

    # 只認「chrome-headless-shell-<a.b.c.d>」這種名字（同安裝端），免得誤刪 ~/.local 裡別的東西。
    - name: 找所有版本目錄（~/.local/chrome-headless-shell-<版本>）
      ansible.builtin.find:
        paths: "{{ _u_home }}/.local"
        patterns: '^chrome-headless-shell-[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$'
        use_regex: true
        file_type: directory
      register: _u_chs_dirs

    - name: 刪版本目錄
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _u_chs_dirs.files | map(attribute='path') | list }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: chrome-headless-shell —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['chrome-headless-shell'] }}"

# ---- Codex CLI ---------------------------------------------------------------
# 工具本體是 ~/.local/codex-<版本>（整包套件）加 ~/.local/bin/codex 這個連過去的 symlink，兩個都刪。
# ~/.codex 不是工具的一部分，但它是「混住」的（同 ~/.cargo）：登入憑證、你的設定、對話紀錄、
# 生出來的圖都在裡面，所以拆開處置（同 rust）：
#   - 登入憑證、設定、你寫的全域指示、對話紀錄：永遠不自動刪，DATA=1 也不刪（同 cargo 的
#     credentials / config，對話紀錄同 claude 的 ~/.claude）。easel 改圖要接回原本的 Codex 對話，
#     sessions 刪了就接不回去。刪本機的 auth.json 不會讓 ChatGPT 那邊的登入失效，要登出就在
#     移除**之前**跑 codex logout。
#   - 生出來的圖、輸入紀錄、log、快取、暫存：資料，DATA=1 才刪。
#   - 其餘沒列到的不動，但會印出來。下面兩份清單只列確定的幾項：Codex 自己還會放別的狀態檔
#     （0.167.0 實際看到的有 state_5.sqlite、thread_history_1.sqlite、logs_2.sqlite、plugins、skills…），
#     版本不同也不一樣。其中 *.sqlite 是對話的索引與歷史，接回對話可能用得到，刻意不列進會刪的那份。
#     確定不要的就補進 _u_codex_data。
- name: Codex CLI
  tags: [codex]
  vars:
    _u_codex_keep:
      - path: "{{ _u_home }}/.codex/auth.json"
        what: ChatGPT 的登入憑證 —— DATA=1 也不會動。要登出：移除前先跑 codex logout
      - path: "{{ _u_home }}/.codex/config.toml"
        what: 你的 Codex 設定 —— DATA=1 也不會動
      - path: "{{ _u_home }}/.codex/AGENTS.md"
        what: 你寫給 Codex 的全域指示 —— DATA=1 也不會動
      - path: "{{ _u_home }}/.codex/.env"
        what: 你放給 Codex 的環境變數 —— DATA=1 也不會動
      - path: "{{ _u_home }}/.codex/sessions"
        what: Codex 的對話紀錄（easel 改圖要接回原本的對話，刪了就接不回去）—— DATA=1 也不會動
    _u_codex_data:
      - path: "{{ _u_home }}/.codex/generated_images"
        what: Codex 生出來的圖（easel 從這裡收圖）
      - path: "{{ _u_home }}/.codex/history.jsonl"
        what: Codex 的輸入紀錄
      - path: "{{ _u_home }}/.codex/log"
        what: Codex 的 log
      - path: "{{ _u_home }}/.codex/cache"
        what: Codex 的快取
      - path: "{{ _u_home }}/.codex/models_cache.json"
        what: Codex 的模型清單快取
      - path: "{{ _u_home }}/.codex/tmp"
        what: Codex 每次執行都會建的暫存（tmp/arg0-macos）
  block:
    - name: ~/.local/bin/codex 是什麼
      ansible.builtin.stat:
        path: "{{ _u_home }}/.local/bin/codex"
      register: _u_codex_bin

    # 只刪自己放的：指進 ~/.local/codex-<版本> 的 symlink，或這個 tag 早期單檔版留下的一般檔案。
    # 指到別處的 symlink 是別的方式裝的（官方 install.sh 之類），留著並報告。
    - name: ~/.local/bin/codex 是不是這裡放的
      ansible.builtin.set_fact:
        _u_codex_ours: >-
          {{ _u_codex_bin.stat.exists
             and (_u_codex_bin.stat.isreg
                  or (_u_codex_bin.stat.lnk_target | default('')).startswith(_u_home ~ '/.local/codex-')) }}

    - name: 刪 ~/.local/bin/codex
      ansible.builtin.file:
        path: "{{ _u_home }}/.local/bin/codex"
        state: absent
      when: _u_codex_ours | bool

    - name: 不是這裡放的就不動
      ansible.builtin.debug:
        msg: "~/.local/bin/codex 是 symlink（→ {{ _u_codex_bin.stat.lnk_target | default('?') }}），不是 mac-bootstrap 放的，沒有刪。"
      when: _u_codex_bin.stat.exists and not (_u_codex_ours | bool)

    # 只認「codex-<x.y.z>」這種名字（同安裝端），免得誤刪 ~/.local 裡別的東西。
    - name: 找所有版本的套件目錄（~/.local/codex-<版本>）
      ansible.builtin.find:
        paths: "{{ _u_home }}/.local"
        patterns: '^codex-[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?$'
        use_regex: true
        file_type: directory
      register: _u_codex_dirs

    # 附屬程式（codex-code-mode-host、rg…）都在套件目錄裡，跟著一起走。
    - name: 刪套件目錄
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _u_codex_dirs.files | map(attribute='path') | list }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: ~/.codex 裡有什麼
      ansible.builtin.find:
        paths: "{{ _u_home }}/.codex"
        file_type: any
        hidden: true
      register: _u_codex_home

    - name: ~/.codex 裡不在清單上的（不動，只報告）
      ansible.builtin.debug:
        msg: >-
          ~/.codex 裡這些不在清單上，DATA=1 也不會動：{{ _u_codex_other | join('、') }}。
          確定是 Codex 自己的狀態檔、不要了，就自己刪，或補進 uninstall-user.yml 的 _u_codex_data。
      vars:
        _u_codex_other: >-
          {{ _u_codex_home.files | map(attribute='path')
             | difference((_u_codex_keep + _u_codex_data) | map(attribute='path')) | map('basename') | sort }}
      when: _u_codex_other | length > 0

    # rmdir 只收空目錄：~/.codex 裡還有登入憑證、設定或沒列到的檔就留著。
    - name: Codex CLI —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['codex'] }}"
        _uninstall_rmdir: "{{ _uninstall_rmdir + [_u_home ~ '/.codex'] }}"
        _uninstall_data: "{{ _uninstall_data + _u_codex_data }}"
        _uninstall_keep: "{{ _uninstall_keep + _u_codex_keep }}"

# ---- Godot -------------------------------------------------------------------
- name: Godot
  tags: [godot]
  block:
    - name: 找所有版本（Godot-<x.y[.z]>.app）
      ansible.builtin.find:
        paths: "{{ godot_app_dir }}"
        patterns: '^Godot-[0-9]+[.][0-9]+([.][0-9]+)?[.]app$'
        use_regex: true
        file_type: directory
      register: _u_godot_apps

    - name: 找 godot 指令
      ansible.builtin.find:
        paths: "{{ _u_home }}/.local/bin"
        patterns: '^godot(-[0-9]+[.][0-9]+([.][0-9]+)?)?$'
        use_regex: true
        file_type: link
      register: _u_godot_links

    - name: 正在跑的程式
      ansible.builtin.command:
        argv: [/bin/ps, -axo, command=]
      register: _u_godot_ps
      changed_when: false

    # 編輯器開著時把 .app 刪掉，沒存的場景會不見。
    - name: Godot 不能正在跑
      ansible.builtin.assert:
        that: _u_godot_apps.files | map(attribute='path') | select('in', _u_godot_ps.stdout) | list | length == 0
        fail_msg: >-
          Godot 還開著（{{ _u_godot_apps.files | map(attribute='path') | select('in', _u_godot_ps.stdout) | map('basename') | join('、') }}），
          先存檔、關掉再移除。什麼都沒動。
        quiet: true

    - name: 刪所有版本與指令
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ (_u_godot_apps.files + _u_godot_links.files) | map(attribute='path') | list }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Godot —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['godot'] }}"
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ _u_home }}/Library/Application Support/Godot"
            what: Godot 的編輯器設定、匯出範本（export templates）、專案清單（所有版本共用）
          - path: "{{ _u_home }}/Library/Caches/Godot"
            what: Godot 的快取
          - path: "{{ _u_home }}/Library/Saved Application State/org.godotengine.godot.savedState"
            what: Godot 視窗狀態

# ---- Docker 相容 -------------------------------------------------------------
- name: Docker 相容
  tags: [docker-compat]
  block:
    # 只刪自己放的 shim：同一個路徑如果是別的東西（例如手動裝的 docker），留著並報告。
    - name: ~/.local/bin/docker 是不是這裡放的
      ansible.builtin.command:
        argv: [/usr/bin/grep, -q, "mac-bootstrap（TAGS=docker-compat）", "{{ _u_home }}/.local/bin/docker"]
      register: _u_docker_shim
      changed_when: false
      failed_when: false

    - name: 刪 docker → podman 的 shim
      ansible.builtin.file:
        path: "{{ _u_home }}/.local/bin/docker"
        state: absent
      when: _u_docker_shim.rc == 0

    - name: 不是這裡放的就不動
      ansible.builtin.debug:
        msg: "~/.local/bin/docker 不是 mac-bootstrap 放的 shim，沒有刪。"
      when: _u_docker_shim.rc == 1

    - name: brew uninstall docker-compose
      community.general.homebrew:
        name: docker-compose
        state: absent

    - name: containers.conf 拿掉 compose_warning_logs
      community.general.ini_file:
        path: "{{ _u_home }}/.config/containers/containers.conf"
        section: engine
        option: compose_warning_logs
        state: absent

    # 只剩空的 [engine] 或什麼都沒有 = 這個檔是這裡建的，刪掉。
    - name: containers.conf 還剩什麼
      ansible.builtin.command:
        argv: [/usr/bin/grep, -vE, '^[[:space:]]*(#.*|\[engine\])?[[:space:]]*$', "{{ _u_home }}/.config/containers/containers.conf"]
      register: _u_containers_conf
      changed_when: false
      failed_when: false

    - name: 空了就刪 containers.conf
      ansible.builtin.file:
        path: "{{ _u_home }}/.config/containers/containers.conf"
        state: absent
      when: _u_containers_conf.rc == 1

    - name: Docker 相容 —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['docker-compat'] }}"
        _uninstall_brew: true

# ---- GitHub Actions 自架執行器 ----------------------------------------------------
# 先從 GitHub 註銷（用 gh 刪掉那台執行器），再拆容器、網路、LaunchAgent。註冊資料的磁碟區跟著刪
# （註銷之後就沒用了）；Docker 的建置快取與映像只在 DATA=1 時刪。
# repo 的 JURY_RUNNER 變數不在這裡動：沒刪的話，工作會排隊等一台不存在的執行器，報告會提醒。
- name: GitHub Actions 自架執行器
  tags: [gha-runner]
  block:
    - name: 從 GitHub 註銷
      ansible.builtin.shell:
        cmd: |
          gh={{ (mac_node_brew_prefix ~ '/bin/gh') | quote }}
          id=$("$gh" api repos/{{ gha_runner_repo }}/actions/runners --jq '.runners[] | select(.name == "{{ gha_runner_name }}") | .id')
          [ -z "$id" ] && exit 0
          "$gh" api -X DELETE "repos/{{ gha_runner_repo }}/actions/runners/$id" && echo removed
        executable: /bin/bash
      register: _u_gha_dereg
      changed_when: "'removed' in _u_gha_dereg.stdout"

    - name: 卸載 LaunchAgent
      ansible.builtin.command:
        argv: [/bin/launchctl, bootout, "gui/{{ ansible_facts.user_uid }}/{{ gha_runner_label }}"]
      register: _u_gha_bootout
      changed_when: _u_gha_bootout.rc == 0
      failed_when: false

    - name: 刪 plist 與常駐腳本
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _u_home }}/Library/LaunchAgents/{{ gha_runner_label }}.plist"
        - "{{ _u_home }}/bin/gha-runner-keepalive.sh"

    - name: 拆容器、網路、註冊資料
      ansible.builtin.shell:
        cmd: |
          p={{ (mac_node_brew_prefix ~ '/bin/podman') | quote }}
          [ -x "$p" ] || exit 0
          "$p" machine inspect {{ podman_machine_name | quote }} --format '{{ '{{' }}.State{{ '}}' }}' 2>/dev/null | grep -qx running || { echo "podman machine 沒開，容器留著"; exit 0; }
          for c in {{ gha_runner_container | quote }} {{ gha_runner_docker_container | quote }}; do
            "$p" container exists "$c" && "$p" rm -f "$c" >/dev/null && echo "removed $c"
          done
          "$p" network exists {{ gha_runner_network | quote }} && "$p" network rm {{ gha_runner_network | quote }} >/dev/null && echo "removed network"
          "$p" volume exists {{ gha_runner_state_volume | quote }} && "$p" volume rm {{ gha_runner_state_volume | quote }} >/dev/null && echo "removed state"
          true
        executable: /bin/bash
      register: _u_gha_rm
      changed_when: "'removed' in _u_gha_rm.stdout"

    - name: DATA=1：Docker 的資料與映像
      ansible.builtin.shell:
        cmd: |
          p={{ (mac_node_brew_prefix ~ '/bin/podman') | quote }}
          "$p" volume exists {{ gha_runner_docker_volume | quote }} && "$p" volume rm {{ gha_runner_docker_volume | quote }} >/dev/null && echo removed
          "$p" images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}' | grep -E '^({{ gha_runner_image }}|{{ gha_runner_docker_image | regex_replace(':.*$', '') }}):' \
            | while read -r i; do "$p" rmi "$i" >/dev/null 2>&1 && echo "removed $i"; done
          true
        executable: /bin/bash
      register: _u_gha_data
      changed_when: "'removed' in _u_gha_data.stdout"
      when: mac_node_uninstall_data | bool

    - name: 執行器 —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['gha-runner'] }}"

    - name: 執行器 —— 提醒
      ansible.builtin.debug:
        msg: >-
          {{ gha_runner_repo }} 的 repo 變數（jury 是 JURY_RUNNER）還指著自架執行器的話，工作會排隊等它。
          要回到 GitHub 的機器：gh variable delete JURY_RUNNER -R {{ gha_runner_repo }}

# ---- podman ------------------------------------------------------------------
- name: podman
  tags: [podman]
  block:
    # 執行器跑在 podman 裡：拆 podman 會讓它斷線。要一起拆就兩個都點名。
    - name: 執行器還在就拒絕
      ansible.builtin.stat:
        path: "{{ _u_home }}/Library/LaunchAgents/{{ gha_runner_label }}.plist"
      register: _u_podman_gha

    - name: 執行器還在就拒絕 —— 判斷
      ansible.builtin.assert:
        that: not _u_podman_gha.stat.exists or 'gha-runner' in ansible_run_tags
        fail_msg: "GitHub Actions 自架執行器還在 podman 裡跑。要一起拆：make uninstall TAGS=gha-runner,podman"
        quiet: true

    - name: podman 在不在
      ansible.builtin.stat:
        path: "{{ mac_node_brew_prefix }}/bin/podman"
      register: _u_podman

    # VM 開著的話先停（libkrun 的 krunkit 行程），否則 brew 移除後它還在背景跑。
    - name: 停掉 podman machine
      ansible.builtin.command:
        argv: ["{{ mac_node_brew_prefix }}/bin/podman", machine, stop, "{{ podman_machine_name }}"]
      register: _u_podman_stop
      changed_when: _u_podman_stop.rc == 0 and 'stopped successfully' in (_u_podman_stop.stdout ~ _u_podman_stop.stderr)
      failed_when: false
      when: _u_podman.stat.exists

    - name: brew uninstall podman
      community.general.homebrew:
        name: podman
        state: absent

    - name: podman —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['podman'] }}"
        _uninstall_brew: true
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ _u_home }}/.local/share/containers"
            what: podman machine 的 VM 磁碟、映像檔、容器、volume（容器裡的資料也在這）
          - path: "{{ _u_home }}/.config/containers"
            what: podman 的設定與 machine 的定義
          - path: "{{ _u_home }}/.ssh/{{ podman_machine_name }}"
            what: podman machine 的 SSH 私鑰（podman 自己產生的）
          - path: "{{ _u_home }}/.ssh/{{ podman_machine_name }}.pub"
            what: podman machine 的 SSH 公鑰

# ---- Rust（rustup）-----------------------------------------------------------
# ~/.cargo 是「混住」的：rustup 的 proxy、cargo install 裝的二進位、你的設定和 token 都在裡面。
# 同 Linux：~/.rustup 整包刪；~/.cargo 拆開刪。不用 `rustup self uninstall`（它會整個刪掉 ~/.cargo）。
- name: Rust（rustup）
  tags: [rust]
  block:
    - name: 找出 rustup 本體與它的 proxy（~/.cargo/bin 裡跟 rustup 是同一個檔的那些）
      ansible.builtin.command:
        argv: [/usr/bin/find, -L, "{{ _u_home }}/.cargo/bin", -maxdepth, "1", -samefile, "{{ _u_home }}/.cargo/bin/rustup"]
      register: _u_rustup_owned
      changed_when: false
      failed_when: false

    - name: 移除 rustup 與它的 proxy
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _u_rustup_owned.stdout_lines }}"

    - name: 移除 ~/.rustup（工具鏈本體）與 rustup 寫的 env 腳本
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _u_home }}/.rustup"
        - "{{ _u_home }}/.cargo/env"
        - "{{ _u_home }}/.cargo/env.fish"
        - "{{ _u_home }}/.cargo/env.nu"
        - "{{ _u_home }}/.cargo/env.tcsh"

    - name: Rust —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['rust'] }}"
        _uninstall_rmdir: "{{ _uninstall_rmdir + [_u_home ~ '/.cargo'] }}"
        _uninstall_data: "{{ _uninstall_data + _d }}"
        _uninstall_keep: "{{ _uninstall_keep + _k }}"
      vars:
        _d:
          - path: "{{ _u_home }}/.cargo/registry"
            what: crates.io 的下載快取（純快取）
          - path: "{{ _u_home }}/.cargo/git"
            what: git 相依的快取（純快取）
          - path: "{{ _u_home }}/.cargo/bin"
            what: cargo install 裝的二進位（rustup 的 proxy 已經移掉，剩下的是你自己裝的）
          - path: "{{ _u_home }}/.cargo/.crates.toml"
            what: cargo install 的安裝紀錄
          - path: "{{ _u_home }}/.cargo/.crates2.json"
            what: cargo install 的安裝紀錄
          - path: "{{ _u_home }}/.cargo/.package-cache"
            what: cargo 的鎖檔
        _k:
          - path: "{{ _u_home }}/.cargo/config.toml"
            what: 你的 cargo 設定 —— DATA=1 也不會動
          - path: "{{ _u_home }}/.cargo/credentials.toml"
            what: registry 的 token —— DATA=1 也不會動

# ---- pnpm --------------------------------------------------------------------
- name: pnpm
  tags: [pnpm]
  block:
    - name: brew uninstall pnpm
      community.general.homebrew:
        name: pnpm
        state: absent

    - name: pnpm —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['pnpm'] }}"
        _uninstall_brew: true
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ _u_home }}/Library/pnpm"
            what: pnpm 的 store 與全域安裝（含 devEngines 下載的 Node）
          - path: "{{ _u_home }}/Library/Caches/pnpm"
            what: pnpm 的下載快取
          - path: "{{ _u_home }}/.local/state/pnpm"
            what: pnpm 的狀態檔
          - path: "{{ _u_home }}/Library/Preferences/pnpm"
            what: pnpm 的全域設定（globalShims 在這裡）

# ---- Node --------------------------------------------------------------------
- name: Node
  tags: [node]
  block:
    - name: 找所有版本目錄（node-<x.y.z>）
      ansible.builtin.find:
        paths: "{{ _u_home }}/.local"
        patterns: '^node-\d+\.\d+\.\d+$'
        use_regex: true
        file_type: directory
      register: _u_node_dirs

    # npm、npx 和 npm i -g 裝的東西都在版本目錄裡，所以一起收掉。
    - name: 移除 ~/.local/node 與所有版本目錄
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ [_u_home ~ '/.local/node'] + (_u_node_dirs.files | map(attribute='path') | list) }}"

    - name: Node —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['node'] }}"
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ _u_home }}/.npm"
            what: npm 的下載快取

# ---- Python（uv）-------------------------------------------------------------
- name: Python（uv）
  tags: [python]
  block:
    - name: brew uninstall uv
      community.general.homebrew:
        name: uv
        state: absent

    # `uv tool install` 的入口是 ~/.local/bin 裡指向 ~/.local/share/uv/tools 的 symlink。
    # DATA=1 刪掉 tools 之後它們就是 dangling，一起清。
    - name: 找 uv tool 的入口（DATA=1）
      ansible.builtin.command:
        argv: [/usr/bin/find, "{{ _u_home }}/.local/bin", -maxdepth, "1", -type, l, -lname, "{{ _u_home }}/.local/share/uv/*"]
      register: _u_uv_links
      changed_when: false
      failed_when: false
      when: mac_node_uninstall_data | bool

    - name: 刪 uv tool 的入口（DATA=1）
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _u_uv_links.stdout_lines | default([]) }}"
      when: mac_node_uninstall_data | bool

    - name: Python —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['python'] }}"
        _uninstall_brew: true
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ _u_home }}/.cache/uv"
            what: uv 的下載與建置快取
          - path: "{{ _u_home }}/.local/share/uv"
            what: uv 下載的 Python（python/）與 uv tool 裝的工具（tools/）
          - path: "{{ _u_home }}/.config/uv"
            what: uv 的全域設定

# ---- Go ----------------------------------------------------------------------
- name: Go
  tags: [go]
  block:
    - name: brew uninstall go
      community.general.homebrew:
        name: go
        state: absent

    # 模組快取是唯讀的（go 刻意的），不先打開寫入權限，刪 ~/go 會失敗。
    - name: 打開模組快取的寫入權限（DATA=1）
      ansible.builtin.command:
        argv: [/bin/chmod, -R, u+w, "{{ _u_home }}/go"]
      changed_when: false
      failed_when: false
      when: mac_node_uninstall_data | bool

    - name: Go —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['go'] }}"
        _uninstall_brew: true
        _uninstall_data: "{{ _uninstall_data + _d }}"
      vars:
        _d:
          - path: "{{ _u_home }}/go"
            what: GOPATH —— 模組快取、GOTOOLCHAIN 下載的 toolchain、go install 裝的二進位（bin/）
          - path: "{{ _u_home }}/Library/Caches/go-build"
            what: Go 的 build cache（純快取）
          - path: "{{ _u_home }}/Library/Application Support/go"
            what: go env -w 寫的設定

# ---- Claude Code CLI ---------------------------------------------------------
- name: Claude Code CLI
  tags: [claude]
  block:
    - name: 讀 claude-rc 的 plist
      ansible.builtin.stat:
        path: "{{ _u_plist }}"
      register: _u_rc_plist

    - name: 防呆：Remote Control 還裝著就不移除 claude
      ansible.builtin.assert:
        that: not _u_rc_plist.stat.exists
        fail_msg: "Remote Control（claude-rc）還在用 claude。一起移除：make uninstall TAGS=claude-rc,claude"
        quiet: true

    # ~/.local/bin/claude 是 symlink，指向 ~/.local/share/claude/versions/<版本>。兩個都要刪：
    # 只刪 symlink 會留下幾百 MB 沒人管；只刪 versions 會留下 dangling symlink。
    - name: 移除 claude（入口與 versions/）
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _u_home }}/.local/bin/claude"
        - "{{ _u_home }}/.local/share/claude"

    - name: claude —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['claude'] }}"
        _uninstall_keep: "{{ _uninstall_keep + _k }}"
      vars:
        _k:
          - path: "{{ _u_home }}/.claude"
            what: 設定、對話紀錄、memory、CLAUDE.md —— 你的資料，DATA=1 也不會動（登入憑證在 Keychain）

# ---- tmux --------------------------------------------------------------------
- name: tmux
  tags: [tmux]
  block:
    - name: 讀 claude-rc 的 plist
      ansible.builtin.stat:
        path: "{{ _u_plist }}"
      register: _u_rc_plist2

    - name: 防呆：Remote Control 還裝著就不移除 tmux
      ansible.builtin.assert:
        that: not _u_rc_plist2.stat.exists
        fail_msg: "Remote Control（claude-rc）在 tmux 裡跑。一起移除：make uninstall TAGS=claude-rc,tmux"
        quiet: true

    - name: brew uninstall tmux
      community.general.homebrew:
        name: tmux
        state: absent

    - name: tmux —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['tmux'] }}"
        _uninstall_brew: true

# ---- PATH 環境設定（profile）--------------------------------------------------
# 最後拆：拆完之後 ssh 'cmd' 與 LaunchAgent 都拿不到 brew 的指令。這次有 profile 時，
# uninstall.yml 最後的「依現況重生」會跳過，不然又寫回去。
- name: PATH 環境設定
  tags: [profile]
  block:
    - name: 拿掉 ~/.zshenv 與 ~/.zprofile 的 managed block
      ansible.builtin.blockinfile:
        path: "{{ _u_home }}/{{ item }}"
        marker: "# {mark} mac-bootstrap profile (managed)"
        state: absent
      loop: [.zshenv, .zprofile]

    - name: 讀剩下的 rc 檔
      ansible.builtin.stat:
        path: "{{ _u_home }}/{{ item }}"
      loop: [.zshenv, .zprofile]
      register: _u_rc_files

    # 這兩個檔原本不存在、是 profile 建的：拿掉 block 之後是空的就刪掉，回到原狀。
    - name: 只剩空白的 rc 檔刪掉
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ _u_rc_files.results | selectattr('stat.exists') | selectattr('stat.size', 'le', 1) | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: 刪 ~/.config/mac-bootstrap
      ansible.builtin.file:
        path: "{{ _u_home }}/.config/mac-bootstrap"
        state: absent

    - name: profile —— 登記
      ansible.builtin.set_fact:
        _uninstall_done: "{{ _uninstall_done + ['profile'] }}"

# ---- brew 的相依 --------------------------------------------------------------
# 只帶走「當初是當相依裝進來、現在沒有人需要」的套件（例如 podman 的 krunkit）。
- name: brew autoremove
  ansible.builtin.command:
    argv: ["{{ mac_node_brew }}", autoremove]
  register: _u_autoremove
  changed_when: "'Uninstalling' in _u_autoremove.stdout"
  when: _uninstall_brew | bool
  tags: always

# ---- 資料目錄的統一處置（同 dev-env-ansible）-----------------------------------
# 到這裡工具已經移除完畢。剩下的是「資料」：預設只報告，DATA=1 才真的刪。
- name: 檢查資料目錄還在不在
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: _data_probe
  loop: "{{ _uninstall_data + _uninstall_keep }}"
  loop_control:
    label: "{{ item.path }}"
  tags: always

# 只量會留下來的。DATA=1 時 _uninstall_keep（~/.claude 等）仍然留著，仍然報大小。
- name: 量會保留的資料目錄有多大
  ansible.builtin.command:
    argv: [/usr/bin/du, -sh, "{{ item.item.path }}"]
  register: _data_size
  changed_when: false
  failed_when: false
  when:
    - item.stat.exists
    - not ((mac_node_uninstall_data | bool)
           and item.item.path in (_uninstall_data | map(attribute='path') | list))
  loop: "{{ _data_probe.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  tags: always

# `| bool` 不能省：DATA=1 走 `-e mac_node_uninstall_data=true`，extra-var 進來是字串。
- name: 移除資料目錄（DATA=1）
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _uninstall_data }}"
  loop_control:
    label: "{{ item.path }}"
  when: mac_node_uninstall_data | bool
  tags: always

# rmdir 只刪空目錄：裡面還有你的東西（例如 ~/.cargo/config.toml）就留著。
- name: 空了的目錄刪掉
  ansible.builtin.command:
    argv: [/bin/rmdir, "{{ item }}"]
  register: _u_rmdir
  changed_when: _u_rmdir.rc == 0
  failed_when: false
  loop: "{{ _uninstall_rmdir }}"
  tags: always

# 只 loop `_data_size.results`：被 when 跳過的元素沒有 stdout，不能另外 selectattr 去撈；
# 「保留」只列真的量過的（有 stdout 的），DATA=1 刪掉的那些在上面「已刪除」列過了。
- name: 移除完成
  ansible.builtin.debug:
    msg: |-
      已移除：{{ _uninstall_done | join('、') if _uninstall_done else '（user 層這次沒有選到任何項目）' }}
      {% if _uninstall_done %}
      PATH（~/.config/mac-bootstrap/env.zsh）已依移除後的現況重新產生；新開的 shell 才生效。
      {% endif %}
      {% set rm_paths = _uninstall_data | map(attribute='path') | list %}
      {% set shown = _data_size.results | selectattr('item.stat.exists') | selectattr('stdout', 'defined') | list %}
      {% set deleted = (_data_probe.results | selectattr('stat.exists') | selectattr('item.path', 'in', rm_paths) | list)
                       if (mac_node_uninstall_data | bool) else [] %}
      {% if shown or deleted %}

      資料：
      {% for p in deleted %}
        已刪除        {{ p.item.path }}
      {% endfor %}
      {% for r in shown %}
        保留  {{ (r.stdout | default('? ')).split()[0].rjust(6) }}  {{ r.item.item.path }}
                {{ r.item.item.what }}
      {% endfor %}
      {% if not (mac_node_uninstall_data | bool) and (shown | selectattr('item.item.path', 'in', rm_paths) | list) %}

      要連上面「保留」而且不是你自己資料的那些一起清：同一個指令加 DATA=1。
      {% endif %}
      {% endif %}

      注意：config 沒有「這台不該有什麼」的紀錄，**下一次不帶 TAGS 的 make install 會把剛移除的
      裝回來**。只想重灌單項就 make install TAGS=<項目>。
  tags: always
