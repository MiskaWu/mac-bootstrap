---
# make verify：HANDOFF §8 驗收清單裡能在本機自動檢查的部分。唯讀，什麼都不改。
# 對應 wsl-bootstrap 的 scripts/verify.sh。
#
# 每項檢查是一段 bash：exit 0 = 通過；exit 2 = 這裡測不了、要人工；其他 = 沒通過。
# level: fail 沒通過算失敗（最後 exit 非零）；warn 只提醒。
# 印出的第一行輸出當作說明。
#
# 寫檢查的規矩（同 dev-env-ansible「別把 exit code 洗掉」）：要判成敗就先
# `out=$(cmd)` 再對 $out 檢查，不要 `cmd | grep | sed` 讓最後一個指令決定成敗。
# Jinja 在這裡會先跑一遍：不要寫 `$` 後面接 `{#`（Jinja 的註解開頭）。
# **變數後面緊接中文（含全形標點）一律寫 `${var}`**：ansible 底下的 bash 3.2 會把中文的第一個
# byte 當成變數名稱的一部分吃掉，剩下的 byte 不是合法 UTF-8，整個 verify 直接炸掉
# （實測：`$ifc）` → 「Refusing to deserialize an invalid UTF8 string」）。

- name: 跑檢查
  ansible.builtin.shell:
    cmd: "{{ item.cmd }}"
    executable: /bin/bash
  loop:
    # ---- 電源 ----
    - name: "pmset：接電源時不睡、可網路喚醒"
      level: fail
      cmd: |
        ac=$(/usr/bin/pmset -g custom | awk '/^AC Power:/ {f=1; next} /^[^ ]/ {f=0} f')
        bad=""
        {% for k, v in mac_node_pmset_ac.items() %}
        grep -Eq '^ +{{ k }} +{{ v }}$' <<<"$ac" || bad="$bad {{ k }}"
        {% endfor %}
        [ -z "$bad" ] || { echo "不符：${bad}（make install TAGS=power）"; exit 1; }
        echo "sleep 0、womp 1 等 {{ mac_node_pmset_ac | length }} 項都對"

    - name: "pmset：蓋子模式 {{ mac_lid_mode }}"
      level: fail
      cmd: |
        have=$(/usr/bin/pmset -g | awk '$1=="SleepDisabled" {print $2}')
        want={{ '1' if mac_lid_mode == 'C' else '0' }}
        [ "$have" = "$want" ] || [ -z "$have" -a "$want" = 0 ] || { echo "disablesleep=${have}，應為 $want"; exit 1; }
        echo "disablesleep=$want"

    - name: "關掉自動安裝 macOS 更新"
      level: fail
      cmd: |
        v=$(defaults read /Library/Preferences/com.apple.SoftwareUpdate AutomaticallyInstallMacOSUpdates 2>/dev/null || echo unset)
        [ "$v" = 0 ] || { echo "AutomaticallyInstallMacOSUpdates=${v}（make install TAGS=softwareupdate）"; exit 1; }
        echo "已關閉"

    # ---- 主機與安全 ----
    - name: "主機名稱"
      level: fail
      cmd: |
        want={{ (mac_host_name | default('')) | quote }}
        [ -n "$want" ] || { echo "config.yml 沒有 mac_host_name"; exit 2; }
        have=$(/usr/sbin/scutil --get LocalHostName)
        [ "$have" = "$want" ] || { echo "LocalHostName=${have}，應為 ${want}（make install TAGS=hostname）"; exit 1; }
        echo "$have.local"

    - name: "FileVault 開著"
      level: fail
      cmd: |
        out=$(/usr/bin/fdesetup status)
        grep -q 'FileVault is On' <<<"$out" || { echo "$out"; exit 1; }
        echo "On"

    - name: "遠端登入（SSH）在聽"
      level: fail
      cmd: |
        /usr/bin/nc -z -G 2 127.0.0.1 22 || { echo "22 埠沒開：系統設定 → 一般 → 共享 → 遠端登入（手動）"; exit 1; }
        echo "22 埠有回應"

    - name: "螢幕共享在聽"
      level: fail
      cmd: |
        /usr/bin/nc -z -G 2 127.0.0.1 5900 || { echo "5900 埠沒開：系統設定 → 一般 → 共享 → 螢幕共享（手動）"; exit 1; }
        echo "5900 埠有回應"

    - name: "sshd 只允許金鑰登入"
      level: fail
      cmd: |
        [ -f /etc/ssh/sshd_config.d/010-hardening.conf ] || { echo "沒有 010-hardening.conf（make install TAGS=sshd）"; exit 1; }
        # (1) 設定值。sshd -T 沒有主機金鑰就不跑；給一把用完即丟的（-h），就不用 root。
        #     OpenSSH 10.5 印 CamelCase、舊版印小寫 → 轉小寫比對。
        t=$(mktemp -d) || { echo "mktemp 失敗"; exit 1; }
        trap 'rm -f "$t/hk" "$t/hk.pub"; rmdir "$t"' EXIT
        /usr/bin/ssh-keygen -q -t ed25519 -N '' -f "$t/hk" || { echo "產生暫時主機金鑰失敗"; exit 1; }
        out=$(/usr/sbin/sshd -T -h "$t/hk" 2>&1 | tr '[:upper:]' '[:lower:]')
        for kv in 'passwordauthentication no' 'kbdinteractiveauthentication no' 'permitrootlogin no'; do
          grep -qx "$kv" <<<"$out" || { echo "sshd -T 缺「${kv}」"; exit 1; }
        done
        # (2) 實際連一次、不給金鑰：伺服器能接受的方式只該剩 publickey。
        probe=$(/usr/bin/ssh -o BatchMode=yes -o PubkeyAuthentication=no -o StrictHostKeyChecking=no \
                  -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=5 \
                  "$(id -un)@127.0.0.1" true 2>&1 | tail -1)
        [[ "$probe" == *"Permission denied (publickey)."* ]] || { echo "實際連線不只收金鑰：$probe"; exit 1; }
        echo "設定值與實際連線都只收金鑰（密碼、鍵盤互動關閉，root 不准登入）"

    - name: "authorized_keys 有公鑰"
      level: fail
      cmd: |
        f={{ (mac_node_home ~ '/.ssh/authorized_keys') | quote }}
        [ -s "$f" ] || { echo "沒有任何公鑰（make install TAGS=authorized-keys）"; exit 1; }
        echo "$(grep -c . "$f") 把"

    # ---- Claude ----
    - name: "Claude Code CLI"
      level: fail
      cmd: |
        b={{ mac_node_claude_bin | quote }}
        [ -x "$b" ] || { echo "找不到 ${b}（make install TAGS=claude）"; exit 1; }
        "$b" --version 2>&1 | head -1

    - name: "登入 shell 沒有會弄壞 Remote Control 的變數"
      level: fail
      cmd: |
        out=$(env -i HOME="$HOME" USER="$USER" /bin/zsh -l -c env 2>&1)
        bad=$(grep -E '^(ANTHROPIC_BASE_URL|CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC|DISABLE_GROWTHBOOK)=' <<<"$out" | cut -d= -f1 || true)
        [ -z "$bad" ] || { echo "~/.zprofile 或系統設定了：$bad"; exit 1; }
        echo "沒有"

    - name: "LaunchAgent {{ claude_rc_label }} 已載入"
      level: fail
      cmd: |
        /bin/launchctl print gui/{{ ansible_facts.user_uid }}/{{ claude_rc_label }} >/dev/null 2>&1 \
          || { echo "沒載入（make install TAGS=claude-rc）"; exit 1; }
        echo "已載入"

    - name: "tmux session {{ claude_rc_session }} 在跑"
      level: fail
      cmd: |
        t={{ mac_node_tmux_bin | quote }}
        [ -x "$t" ] || { echo "沒有 tmux"; exit 1; }
        "$t" has-session -t ={{ claude_rc_session }} 2>/dev/null || { echo "session 不在（等 5 分鐘內 LaunchAgent 重建，或 launchctl kickstart）"; exit 1; }
        echo "在"

    - name: "Remote Control 已連線（沒有卡在第一次的確認問題）"
      level: fail
      cmd: |
        t={{ mac_node_tmux_bin | quote }}
        # 目標要寫 =name:（結尾冒號）。只寫 =name，capture-pane 會當成 pane 名稱而找不到。
        out=$("$t" capture-pane -p -t ={{ claude_rc_session }}: 2>/dev/null) || { echo "讀不到 tmux 畫面"; exit 1; }
        # 2.1.322 的信任問題長這樣：「Trust /Users/…/Developer? [y/N]」
        if grep -qiE 'enable remote control|trust (this|the|/)|do you trust|spawn mode|quick safety check|\[y/n\]' <<<"$out"; then
          echo "卡在問題上：先在真的終端機手動跑一次 claude remote-control 回答問題，再 tmux kill-session -t {{ claude_rc_session }}"
          exit 1
        fi
        # 連線狀態不看畫面：「Connected」那行只在一開始印，跑久了會被「Reconnected after …」
        # 的紀錄擠出畫面（實測）。改看伺服器程序有沒有對外的 443 連線。
        pids=$(pgrep -a -f '^[^ ]*/claude remote-control' || true)
        [ -n "$pids" ] || { echo "沒有找到 remote-control 程序"; exit 1; }
        n=0
        for p in $pids; do
          c=$(/usr/sbin/lsof -nP -a -p "$p" -iTCP:443 -sTCP:ESTABLISHED 2>/dev/null | tail -n +2 | wc -l | tr -d ' ')
          n=$((n + c))
        done
        [ "$n" -gt 0 ] || { echo "伺服器沒有對外連線。畫面最後一行：$(grep -v '^[[:space:]]*$' <<<"$out" | tail -1)"; exit 1; }
        echo "已連線（${n} 條 443 連線）"

    - name: "Remote Control 伺服器的環境是乾淨的"
      level: fail
      cmd: |
        # 錨在行首：只抓 argv[0] 是 claude 的那支，不要抓到這段檢查自己的 bash 或外層的 zsh -c。
        # -a 一定要：macOS 的 pgrep 預設不列出自己的上層程序。從手機開的工作階段跑 verify 時，
        # remote-control 伺服器正是上層，不加 -a 就永遠「找不到」（實測）。
        pids=$(pgrep -a -f '^[^ ]*/claude remote-control' || true)
        [ -n "$pids" ] || { echo "沒有找到 remote-control 程序"; exit 1; }
        for p in $pids; do
          envs=$(ps eww -o command= -p "$p" 2>/dev/null || true)
          if grep -qE '(^| )(CLAUDECODE|ANTHROPIC_BASE_URL|CLAUDE_CODE_SESSION_ID)=' <<<"$envs"; then
            echo "程序 $p 帶著 Claude 工作階段的變數：它不是由 launchd 起的。tmux kill-session 後讓 LaunchAgent 重建"
            exit 1
          fi
        done
        echo "程序 $(echo $pids | tr '\n' ' ')沒有帶到工作階段的變數"

    - name: "~/.zshenv 與 ~/.zprofile 都有 managed 區塊"
      level: fail
      cmd: |
        for f in .zshenv .zprofile; do
          grep -q 'BEGIN mac-bootstrap profile' "$HOME/$f" 2>/dev/null || { echo "$f 沒有（make install TAGS=profile）"; exit 1; }
        done
        echo "兩個都有"

    # 用互動 shell 驗一定是綠的，驗不出東西。模擬兩種真正會出事的情境（research §6.3）。
    - name: "非互動 shell 拿得到指令（模擬 ssh 'cmd' 與 LaunchAgent）"
      level: fail
      cmd: |
        want="make brew"
        [ -x {{ mac_node_claude_bin | quote }} ] && want="$want claude"
        [ -x {{ mac_node_tmux_bin | quote }} ] && want="$want tmux"
        # 語言工具：裝了才要求（偵測式，同 profile）
        b={{ mac_node_brew_prefix | quote }}/bin
        [ -x "$b/go" ] && want="$want go"
        [ -x "$b/uv" ] && want="$want uv"
        [ -x "$b/pnpm" ] && want="$want pnpm"
        [ -x "$b/podman" ] && want="$want podman"
        [ -x "$HOME/.local/node/bin/node" ] && want="$want node npm"
        [ -x "$HOME/.cargo/bin/rustup" ] && want="$want cargo rustc"
        [ -x "$HOME/.local/bin/docker" ] && want="$want docker"
        [ -x "$b/docker-compose" ] && want="$want docker-compose"
        [ -L "$HOME/.local/bin/godot" ] && want="$want godot"
        # easel 的前置工具（TAGS=codex）
        [ -x {{ mac_node_codex_bin | quote }} ] && want="$want codex"
        # 命令列工具（TAGS=bash / awscli / gh）
        [ -x "$b/bash" ] && want="$want bash"
        [ -x "$b/aws" ] && want="$want aws"
        [ -x "$b/gh" ] && want="$want gh"
        bad=""
        for mode in ssh launchd; do
          flag=""; [ $mode = launchd ] && flag="-l"
          for c in $want; do
            p=$(env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/zsh $flag -c "command -v $c" 2>/dev/null || true)
            [ -n "$p" ] || { bad="$bad $mode:$c"; continue; }
            # make 一定要是 GNU 4.x，不能是 /usr/bin/make（path_helper 重排的那個坑）
            if [ $c = make ] && [ "$p" = /usr/bin/make ]; then bad="$bad $mode:make=3.81"; fi
            # bash 一定要是 brew 的 5.x，不能是 /bin/bash（3.2）：TAGS=bash 不改 shebang，
            # 靠 env.zsh 把 brew 排在 /bin 前面，#!/usr/bin/env bash 才拿得到
            if [ $c = bash ] && [ "$p" != "$b/bash" ]; then bad="$bad $mode:bash=${p}"; fi
          done
        done
        [ -z "$bad" ] || { echo "拿不到或拿錯：$bad"; exit 1; }
        echo "ssh 與 launchd 兩種情境都拿得到：$want"

    # 語言工具的「規矩有沒有被破壞」。沒裝的項目回 0 並註明，不算失敗（裝不裝由 tag 決定）。
    - name: "語言工具的版本與設定"
      level: fail
      cmd: |
        b={{ mac_node_brew_prefix | quote }}/bin
        out=""; bad=""
        if [ -x "$b/go" ]; then
          tc=$("$b/go" env GOTOOLCHAIN 2>/dev/null || true)
          [ "$tc" = auto ] || bad="$bad GOTOOLCHAIN=${tc}（應為 auto）"
          out="$out go $("$b/go" env GOVERSION 2>/dev/null)"
        fi
        if [ -x "$HOME/.local/node/bin/node" ]; then
          v=$("$HOME/.local/node/bin/node" -v)
          [ "$v" = "v{{ node_version }}" ] || bad="$bad node=${v}（pin 的是 v{{ node_version }}）"
          out="$out node $v"
        fi
        if [ -x "$b/pnpm" ]; then
          s=$("$b/pnpm" config get globalShims --location global 2>/dev/null || true)
          [ "$s" = "{{ pnpm_global_shims | string | lower }}" ] || bad="$bad pnpm.globalShims=${s}"
          out="$out pnpm $("$b/pnpm" --version)"
        fi
        if [ -x "$HOME/.cargo/bin/rustup" ]; then
          d=$("$HOME/.cargo/bin/rustup" default 2>/dev/null || true)
          [ -n "$d" ] || bad="$bad rust 沒有預設工具鏈"
          out="$out rust ${d%% *}"
        fi
        if [ -x "$b/uv" ]; then
          # UV_PYTHON_INSTALL_BIN=0 的效果：~/.local/bin 裡不該有 uv 的 python3.X 連結
          links=$(/usr/bin/find "$HOME/.local/bin" -maxdepth 1 -name 'python3*' 2>/dev/null | wc -l | tr -d ' ')
          [ "$links" = 0 ] || bad="$bad ~/.local/bin 裡有 ${links} 個 python3* 連結"
          out="$out uv $("$b/uv" --version | awk '{print $2}')"
        fi
        if [ -x "$b/podman" ]; then
          "$b/podman" machine inspect {{ podman_machine_name | quote }} >/dev/null 2>&1 || bad="$bad podman machine 不在（make install TAGS=podman）"
          st=$("$b/podman" machine inspect {{ podman_machine_name | quote }} 2>/dev/null | /usr/bin/grep -o '"State": *"[a-z]*"' | /usr/bin/grep -o '[a-z]*"$' | tr -d '"')
          out="$out podman machine=${st:-?}"
        fi
        if [ -e "$HOME/.local/bin/docker" ]; then
          /usr/bin/grep -q '/bin/podman "\$@"' "$HOME/.local/bin/docker" || bad="$bad ~/.local/bin/docker 不是交給 podman 的 shim"
          out="$out docker→podman"
        fi
        if [ -x "$b/docker-compose" ]; then
          out="$out compose $("$b/docker-compose" version --short 2>/dev/null)"
        fi
        if [ -L "$HOME/.local/bin/godot" ]; then
          for v in {{ godot_versions | map('quote') | join(' ') }}; do
            gv=$("$HOME/.local/bin/godot-$v" --version 2>/dev/null | tail -1 || true)
            [[ $gv == "$v".stable* ]] || bad="$bad godot-${v}=${gv:-跑不起來}"
          done
          d=$(/usr/bin/readlink "$HOME/.local/bin/godot")
          [[ $d == */Godot-{{ godot_default_version }}.app/* ]] || bad="$bad godot 指向 ${d}（應為 {{ godot_default_version }}）"
          out="$out godot {{ godot_versions | join('/') }}"
        fi
        [ -z "$bad" ] || { echo "不對：$bad"; exit 1; }
        [ -n "$out" ] || { echo "沒有裝任何語言工具"; exit 0; }
        echo "${out# }"

    # TAGS=codex（easel 的前置工具；縮圖在 macOS 用內建的 sips，所以只有這一個）。沒裝回 0 並註明，不算失敗。
    # 只看 `codex --version` 不夠：只有一個執行檔的單檔版 --version 正常，卻因為沒有 codex-code-mode-host
    # 而生不了圖（2026-11-16 實測）。所以這裡看兩件事：版本，以及「照 codex 自己的規則找得到、起得來的
    # codex-code-mode-host」。兩段檢查的內容在 defaults 的 mac_node_codex_*_probe（為什麼那樣寫也在那裡），
    # 安裝後的斷言用的是同一段，不各寫一份。
    - name: "easel 的前置工具（codex 與 codex-code-mode-host）"
      level: fail
      cmd: |
        c={{ mac_node_codex_bin | quote }}
        [ -e "$c" ] || [ -L "$c" ] || { echo "沒有裝 codex"; exit 0; }
        version_probe() {
        {{ mac_node_codex_version_probe }}
        }
        host_probe() {
        {{ mac_node_codex_host_probe }}
        }
        bad=""
        cv=$(version_probe 2>/dev/null | tail -1)
        [ "${cv##* }" = {{ codex_version | quote }} ] || bad="$bad codex=${cv:-跑不起來}（pin 的是 {{ codex_version }}）"
        hp=$(host_probe 2>/dev/null) || bad="$bad ${hp}"
        [ -z "$bad" ] || { echo "不對：${bad# }（make install TAGS=codex）"; exit 1; }
        echo "codex ${cv##* }，code-mode-host 在 ${hp}"

    # TAGS=bash / awscli / gh。不跑 aws、gh 本身：gh 第一次跑任何指令都可能寫出
    # ~/.config/gh/config.yml（設定版本的遷移；未實測，保守起見），verify 不准有副作用。
    # 版本從 brew 的連結讀（/opt/homebrew/bin/gh → ../Cellar/gh/<版本>/bin/gh），順便確認是 brew 的。
    - name: "命令列工具（bash、aws、gh）的版本"
      level: fail
      cmd: |
        b={{ mac_node_brew_prefix | quote }}/bin
        out=""; bad=""
        if [ -x "$b/bash" ]; then
          v=$("$b/bash" -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"' 2>/dev/null || true)
          [ "${v%%.*}" -ge 4 ] 2>/dev/null || bad="$bad bash=${v:-跑不起來}（要 4 以上）"
          out="$out bash $v"
        fi
        for t in aws:awscli gh:gh; do
          c=${t%%:*}; f=${t#*:}
          [ -x "$b/$c" ] || continue
          l=$(/usr/bin/readlink "$b/$c" || true)
          [[ $l == */Cellar/"$f"/* ]] || { bad="$bad ${c} 不是 brew 的 ${f}（${l:-不是連結}）"; continue; }
          v=${l#*/Cellar/"$f"/}
          out="$out $c ${v%%/*}"
        done
        [ -z "$bad" ] || { echo "不對：$bad"; exit 1; }
        [ -n "$out" ] || { echo "沒有裝 bash、aws、gh"; exit 0; }
        echo "${out# }"

    # 登入是帳號的事（手動），這裡只看設定在不在。token 有沒有過期不看：要連網，而且本來就會過期。
    - name: "aws、gh 的登入設定（手動）"
      level: warn
      cmd: |
        b={{ mac_node_brew_prefix | quote }}/bin
        ok=""; miss=""
        if [ -x "$b/aws" ]; then
          if /usr/bin/grep -qE '^[[:space:]]*sso_(start_url|session)[[:space:]]*=' "$HOME/.aws/config" 2>/dev/null; then
            ok="$ok aws（~/.aws/config 有 SSO 設定）"
          else
            miss="$miss aws（aws configure sso，或從別台搬 ~/.aws/config）"
          fi
        fi
        if [ -x "$b/gh" ]; then
          if /usr/bin/grep -q '^github.com:' "$HOME/.config/gh/hosts.yml" 2>/dev/null; then
            ok="$ok gh（登入過 github.com）"
          else
            miss="$miss gh（gh auth login）"
          fi
        fi
        [ -z "$miss" ] || { echo "還沒設定：${miss# }"; exit 1; }
        [ -n "$ok" ] || { echo "沒有裝 aws、gh"; exit 0; }
        echo "${ok# }"

    # ---- Claude 的整台電腦層（/Library/Application Support/ClaudeCode）----
    - name: "這台的規矩（整台電腦層的 CLAUDE.md）"
      level: warn
      cmd: |
        f={{ (mac_node_claude_managed_dir ~ '/CLAUDE.md') | quote }}
        [ -f "$f" ] || { echo "沒有（make install TAGS=claude-md，要 sudo）"; exit 1; }
        o=$(/usr/bin/stat -f '%Su' "$f")
        [ "$o" = root ] || { echo "擁有者是 ${o}，應為 root（make install TAGS=claude-md）"; exit 1; }
        /usr/bin/grep -q 'mac-bootstrap' "$f" || { echo "不是 mac-bootstrap 產生的"; exit 1; }
        echo "有（root 所有）"

    # 規則用 plutil 讀（JSON 也吃），輸出的 / 會跳脫成 \/，比對前換回來。
    - name: "要裝東西先問（整台電腦層的 managed-settings.d）"
      level: warn
      cmd: |
        f={{ (mac_node_claude_managed_dir ~ '/managed-settings.d/mac-bootstrap.json') | quote }}
        [ -f "$f" ] || { echo "沒有（make install TAGS=claude-guard，要 sudo）"; exit 1; }
        ask=$(/usr/bin/plutil -extract permissions.ask json -o - "$f" 2>/dev/null | sed 's#\\/#/#g' || true)
        n=0; missing=""
        {% for r in claude_guard_ask %}
        if /usr/bin/grep -qF -- {{ ('"' ~ r ~ '"') | quote }} <<<"$ask"; then n=$((n + 1)); else missing="$missing {{ r | quote }}"; fi
        {% endfor %}
        [ -z "$missing" ] || { echo "少了 $(echo $missing | wc -w | tr -d ' ') 條（make install TAGS=claude-guard）：${missing# }"; exit 1; }
        # 系統只用最高的 managed 來源（docs: managed-settings）。有 MDM 描述檔時，這個檔會被整個略過。
        # 後台政策（組織帳號）從這裡查不到，要在工作階段裡看 /status 的 Setting sources。
        if [ -e "/Library/Managed Preferences/com.anthropic.claudecode.plist" ]; then
          echo "檔案在（${n} 條），但這台有 MDM 描述檔 com.anthropic.claudecode：這個檔會被略過"; exit 1
        fi
        echo "${n} 條安裝類指令會先問"

    # 過渡：2026-11-16 以前放在 ~/.claude（個人層）。~/.claude 現在是 claude-config 的連結，
    # 舊版留著會跟著進共用 repo。claude-config 的 make link 會把舊檔搬成 .pre-link 備份。
    - name: "~/.claude 沒有舊版的規矩與護欄"
      level: warn
      cmd: |
        left=""
        /usr/bin/grep -q 'BEGIN mac-bootstrap (managed)' "$HOME/.claude/CLAUDE.md" 2>/dev/null && left="$left CLAUDE.md 的 block"
        /usr/bin/grep -qF '"Bash(*brew install *)"' "$HOME/.claude/settings.json" 2>/dev/null && left="$left settings.json 的護欄"
        [ -z "$left" ] || { echo "還有：${left# }（到 claude-config 跑 make link，舊檔會搬成 .pre-link 備份）"; exit 1; }
        echo "沒有"

    - name: "全域 git 身分"
      level: fail
      cmd: |
        e=$(git config --global user.email || true)
        [ -n "$e" ] || { echo "沒設（make install TAGS=git-identity）"; exit 1; }
        echo "$(git config --global user.name) <$e>"

    # ---- 遠端通道 ----
    - name: "Tailscale 已安裝並在跑"
      level: fail
      cmd: |
        [ -d /Applications/Tailscale.app ] || { echo "沒裝（make install TAGS=tailscale）"; exit 1; }
        pgrep -xq Tailscale || { echo "裝了但沒在跑：打開它並登入，設定「登入時啟動」（手動）"; exit 1; }
        echo "在跑（登入狀態請在選單列確認）"

    - name: "Chrome 遠端桌面主機在跑"
      level: warn
      cmd: |
        [ -f /Library/LaunchAgents/org.chromium.chromoting.plist ] || { echo "沒裝（不由 IaC 管，要用請自己裝）"; exit 1; }
        pgrep -fq remoting_me2me_host || { echo "裝了但沒在跑"; exit 1; }
        echo "在跑"

    - name: "目前的網路"
      level: warn
      cmd: |
        ifc=$(route -n get default 2>/dev/null | awk '/interface:/ {print $2}')
        port=$(networksetup -listallhardwareports | awk -v i="$ifc" '/^Hardware Port:/ {p=substr($0, 16)} $2==i {print p}')
        if [ "$port" = "Wi-Fi" ]; then echo "走 Wi-Fi（${ifc}）：開機前的 SSH 解鎖在 Wi-Fi 上可能不行，建議接有線"; exit 1; fi
        echo "走 ${port}（${ifc}）"

    # ---- 乾淨原則 ----
    - name: "brew 沒有 IaC 以外的套件"
      level: warn
      cmd: |
        brew={{ mac_node_brew | quote }}
        [ -x "$brew" ] || { echo "沒有 Homebrew"; exit 1; }
        extra_f=$(comm -23 <("$brew" leaves | sort) <(printf '%s\n' {{ mac_node_brew_allowed_formulae | map('quote') | join(' ') }} | sort))
        extra_c=$(comm -23 <("$brew" list --cask -1 | sort) <(printf '%s\n' {{ mac_node_brew_allowed_casks | map('quote') | join(' ') }} | sort))
        if [ -n "$extra_f$extra_c" ]; then
          echo "多出來的：$(echo $extra_f $extra_c)（只報告不移除；要留就加進 IaC，不要就自己 brew uninstall）"
          exit 1
        fi
        echo "只有 IaC 宣告的"

    # brew 以外裝進主機的路：拖進來的 App、.pkg、開機或登入就跑的 plist、丟進 ~/.local/bin 的執行檔。
    # 允許清單在 defaults 的 mac_node_allowed_*。
    - name: "App、.pkg、開機啟動項目、執行檔沒有 IaC 以外的"
      level: warn
      cmd: |
        hit() { local s=$1 p; shift; for p in "$@"; do [[ $s == $p ]] && return 0; done; return 1; }
        allow_apps=({{ mac_node_allowed_apps | map('quote') | join(' ') }})
        allow_pkgs=({{ mac_node_allowed_pkgs | map('quote') | join(' ') }})
        allow_launchd=({{ mac_node_allowed_launchd | map('quote') | join(' ') }})
        allow_bins=({{ mac_node_allowed_user_bins | map('quote') | join(' ') }})
        extra=""
        while IFS= read -r a; do
          id=$(/usr/bin/defaults read "$a/Contents/Info" CFBundleIdentifier 2>/dev/null || echo "?")
          [[ $id == com.apple.* ]] && continue
          hit "$id" "${allow_apps[@]}" || extra="$extra app:${a##*/}"
        done < <(/usr/bin/find /Applications "$HOME/Applications" -maxdepth 3 -name '*.app' -prune 2>/dev/null)
        for p in $(/usr/sbin/pkgutil --pkgs); do
          [[ $p == com.apple.* ]] && continue
          hit "$p" "${allow_pkgs[@]}" || extra="$extra pkg:${p}"
        done
        for d in "$HOME/Library/LaunchAgents" /Library/LaunchAgents /Library/LaunchDaemons; do
          for f in "$d"/*.plist; do
            [ -e "$f" ] || continue
            n=${f##*/}; n=${n%.plist}
            hit "$n" "${allow_launchd[@]}" || extra="$extra launchd:${n}"
          done
        done
        for f in "$HOME"/.local/bin/* "$HOME"/.local/bin/.[!.]* "$HOME"/bin/* "$HOME"/bin/.[!.]*; do
          [ -e "$f" ] || [ -L "$f" ] || continue
          r=${f#"$HOME"/}
          hit "$r" "${allow_bins[@]}" || extra="$extra ~/${r}"
        done
        [ -z "$extra" ] || { echo "多出來的：${extra# }（只報告不移除；要留就加進 IaC 或 mac_node_allowed_*）"; exit 1; }
        echo "只有 IaC 宣告的"

    # 語言工具各自的「全域安裝」。這台的規矩是工具跟著專案走（README「語言的原則」），
    # 全域裝的東西不在任何專案的宣告裡，換一台就不見。
    - name: "語言工具沒有全域安裝的套件"
      level: warn
      cmd: |
        extra=""
        nm="$HOME/.local/node/lib/node_modules"
        if [ -d "$nm" ]; then
          for d in "$nm"/* "$nm"/@*/*; do
            [ -e "$d" ] || continue
            n=${d#"$nm"/}
            [[ $n == npm || $n == corepack || $n == @* && ! $n == */* ]] && continue
            extra="$extra npm:${n}"
          done
        fi
        # 直接讀 pnpm 全域目錄裡的 package.json，不跑 `pnpm ls -g`：它會順手建出
        # ~/Library/pnpm/bin（實測），verify 不准改任何東西。
        while IFS= read -r pj; do
          deps=$(/usr/bin/plutil -extract dependencies json -o - "$pj" 2>/dev/null || true)
          for n in $(/usr/bin/grep -o '"[^"]*":' <<<"$deps" | tr -d '":\\'); do
            extra="$extra pnpm:${n}"
          done
        done < <(/usr/bin/find "$HOME/Library/pnpm/global" -maxdepth 3 -name package.json -not -path '*/node_modules/*' 2>/dev/null)
        # 直接讀 cargo 的清單檔，不跑 `cargo install --list`：它會順手建出空的 .crates.toml /
        # .crates2.json（實測），verify 不准改任何東西。
        if [ -s "$HOME/.cargo/.crates.toml" ]; then
          for c in $(awk -F'"' '/^"/ {split($2, a, " "); print a[1]}' "$HOME/.cargo/.crates.toml"); do
            extra="$extra cargo:${c}"
          done
        fi
        if [ -x {{ mac_node_brew_prefix | quote }}/bin/uv ]; then
          td=$({{ mac_node_brew_prefix | quote }}/bin/uv tool dir 2>/dev/null || true)
          for d in "$td"/*; do
            [ -n "$td" ] && [ -e "$d" ] || continue
            extra="$extra uv-tool:${d##*/}"
          done
        fi
        if [ -x {{ mac_node_brew_prefix | quote }}/bin/go ]; then
          gb=$({{ mac_node_brew_prefix | quote }}/bin/go env GOBIN 2>/dev/null || true)
          [ -n "$gb" ] || gb="$({{ mac_node_brew_prefix | quote }}/bin/go env GOPATH 2>/dev/null)/bin"
          for f in "$gb"/*; do
            [ -e "$f" ] || continue
            extra="$extra go:${f##*/}"
          done
        fi
        # gh extension install 裝的擴充（TAGS=gh）。直接列目錄，不跑 gh extension list（同上，不准有副作用）。
        for d in "$HOME/.local/share/gh/extensions"/*; do
          [ -e "$d" ] || continue
          extra="$extra gh-ext:${d##*/}"
        done
        [ -z "$extra" ] || { echo "全域裝的：${extra# }（只報告不移除；工具請寫進專案自己的宣告）"; exit 1; }
        echo "沒有（npm、pnpm、cargo、uv tool、go install、gh extension 都是空的）"
  loop_control:
    label: "{{ item.name }}"
  register: _verify
  changed_when: false
  failed_when: false
  check_mode: false

- name: 驗收結果
  ansible.builtin.debug:
    msg: |-
      ✓ 通過   ✗ 沒通過   ⚠ 提醒或要人工確認
      {% for r in _verify.results %}
      {% set mark = '✓' if r.rc == 0 else ('✗' if (r.item.level == 'fail' and r.rc != 2) else '⚠') %}
      {{ mark }} {{ r.item.name }} — {{ (r.stdout_lines | first) if r.stdout_lines else (r.stderr_lines | first | default('')) }}
      {% endfor %}

- name: 有沒通過的項目就失敗
  ansible.builtin.assert:
    that: _verify_failed | length == 0
    fail_msg: "沒通過：{{ _verify_failed | join('、') }}"
    success_msg: "能自動檢查的都通過了。HANDOFF §8 其餘項目（手機連線、拔網路、重開機）要人工測。"
  vars:
    _verify_failed: >-
      {{ _verify.results
         | selectattr('item.level', 'equalto', 'fail')
         | rejectattr('rc', 'in', [0, 2])
         | map(attribute='item.name') | list }}
