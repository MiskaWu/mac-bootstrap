---
# 機器專屬的值（主機名稱、git 身分、公鑰…）不在這裡，在 config.yml（範本 config.example.yml）。
# 這裡只放「每台都一樣」的預設，以及 config.yml 沒填時的退路。

mac_node_home: "{{ ansible_facts.env.HOME }}"
mac_node_brew_prefix: /opt/homebrew
mac_node_brew: "{{ mac_node_brew_prefix }}/bin/brew"

# ---- 電源 -------------------------------------------------------------------
# pmset -c（只管接電源時）。這台的用途是常駐節點：永不睡眠、螢幕 10 分鐘後關、可被網路喚醒。
mac_node_pmset_ac:
  sleep: 0
  disksleep: 0
  displaysleep: 10
  womp: 1
  tcpkeepalive: 1
mac_lid_mode: A

# ---- Claude Code / Remote Control --------------------------------------------
mac_node_claude_bin: "{{ mac_node_home }}/.local/bin/claude"
mac_node_tmux_bin: "{{ mac_node_brew_prefix }}/bin/tmux"
claude_rc_label: local.claude-rc
claude_rc_session: claude-rc
claude_rc_name: home-mac
claude_rc_workdir: ""
claude_rc_spawn: same-dir
claude_rc_log_dir: "{{ mac_node_home }}/Library/Logs"
# 不要讓 Claude 工作階段的環境漏進 Remote Control 伺服器（理由見 CLAUDE.md 地雷）。
# 伺服器用 env -i 起一個乾淨環境，只放行這幾個；PATH 由 zsh -l 讀 ~/.zprofile 重建。
claude_rc_env_passthrough: [HOME, USER, LOGNAME, TMPDIR, SSH_AUTH_SOCK, LANG]

# ---- Tailscale ---------------------------------------------------------------
# GUI 版（Standalone）。cask 名稱會改，換之前先 `brew info --cask <名稱>` 確認。
mac_node_tailscale_cask: tailscale-app

# ---- ssh ---------------------------------------------------------------------
ssh_key_tag: mac
ssh_key_comment: ""
ssh_key_scopes: [github]
ssh_authorized_keys: []
ssh_authorized_keys_revoked: []
# scope → Host 的對應，同 wsl-bootstrap。沒列的原樣當 Host。
mac_node_ssh_scope_hosts:
  github: github.com
  gitlab: gitlab.com
  bitbucket: bitbucket.org

# ---- 語言與容器（research/language-versions.md，Miska 2026-11-12 核准）------------
# 不裝通用版本管理器。專案要的版本由專案自己宣告，交給語言自己的機制下載：
# go.mod 的 toolchain（GOTOOLCHAIN=auto）、uv 的 .python-version、pnpm 的 devEngines.runtime、
# rust-toolchain.toml。主機只放「bootstrap 用的那一份」。
#
# Node：官方 tarball，明確 pin（不支援 latest）。改版本號再 make install TAGS=node，
# ~/.local/node 會切過去，舊版本目錄（連同裡面 npm i -g 裝的）會被清掉。
node_version: "26.13.1"
node_dist_url: "https://nodejs.org/dist/v{{ node_version }}"
# pnpm：關掉 globalShims。不關的話，遠端工作階段可以透過 pnpm 全域裝 Node，
# pnpm 就悄悄變成 Node 的版本管理器（research §7-3）。
pnpm_global_shims: false
# Rust：官方 rustup-init 的參數，同 Linux。--no-modify-path 一定要（rustup 預設會建 ~/.zshenv）。
rust_profile: minimal
rust_components: [rustfmt, clippy]
# podman machine：只建不啟動，用到時才 `podman machine start`（Miska 核准：不開機自動啟動）。
# 配額：16 核心、64 GB 的機器，給 VM 8 核心、16 GB（2026-11-16 為了服務開發調高；改了再 make install TAGS=podman 會套到現有的 VM）。記憶體單位 MiB、磁碟 GiB。上限碰過就不還給主機，不要設超過同時要跑的服務需要的量。
podman_machine_name: podman-machine-default
podman_machine_cpus: 8
podman_machine_memory: 16384
podman_machine_disk: 100

# ---- Claude 的整台電腦層（tasks/claude-md.yml、claude-guard.yml，system 層）----------
# 官方的 managed 位置（docs: memory、managed-settings）。這台的規矩與護欄放這裡，~/.claude 留給 claude-config。
mac_node_claude_managed_dir: /Library/Application Support/ClaudeCode
# 規矩裡寫的 IaC repo 位置（= 這個 repo）
mac_node_repo_dir: "{{ playbook_dir }}"

# ---- 要裝東西先問（tasks/claude-guard.yml）-------------------------------------
# 寫進整台電腦層的 managed-settings.d/mac-bootstrap.json 的 permissions.ask。比對規則（code.claude.com/docs/en/permissions）：
#   - `*` 可以放在任何位置；開頭的 `*` 讓絕對路徑（/opt/homebrew/bin/brew …）也對得上。
#   - `a && b`、`a | b` 會拆開逐段比對，任何一段對上就問 → `curl … | sh` 會以 `sh` 對上。
#   - 前面帶環境變數（`FOO=1 brew install x`）照樣對得上。
#   - 自動模式也會問；ask 排在 allow 前面，專案設定的 allow 蓋不過它。
# 刻意不問的：專案層級的版本下載（uv run、pnpm exec、rustup 依 rust-toolchain.toml、go 的 toolchain）、
# podman 容器裡的 apt —— 它們不落在主機的全域環境。
# 規則只比對兩種寫法：指令開頭（`brew install x`）與前面接路徑（`/opt/homebrew/bin/brew install x`）。
# 不用開頭的 `*`：它連引號裡的文字也比對（實測 `grep "要 sudo 的"` 被 `*sudo *` 攔下）。
# 前面帶 env 賦值（`FOO=1 brew install`）時 ask 規則照樣對得上（docs）。
# 下面每一項是「指令開頭」，會各自展開成 `Bash(<開頭>*)` 與 `Bash(*/<開頭>*)` 兩條。
claude_guard_ask_commands:
  # 主機套件管理
  - "brew install "
  - "brew reinstall "
  - "brew upgrade"
  - "brew uninstall "
  - "brew tap "
  - "brew link "
  - "brew bundle"
  - "installer -pkg"
  - "softwareupdate -i"
  - "softwareupdate --install"
  - "sudo "
  # 透過 IaC 或專案的 make 裝到主機（這也是改主機，照樣先問）
  - "make install"
  - "make uninstall"
  - "ansible-playbook "
  # 語言的全域安裝
  - "npm install -g"
  - "npm i -g"
  - "npm install --global"
  - "npm i --global"
  - "npm link"
  - "pnpm add -g"
  - "pnpm add --global"
  - "pnpm install -g"
  - "pnpm i -g"
  - "pnpm link --global"
  - "pnpm env "
  - "yarn global "
  - "pip install "
  - "pip3 install "
  - "python -m pip install "
  - "python3 -m pip install "
  - "pipx install "
  - "uv tool install "
  - "cargo install "
  - "cargo binstall "
  - "rustup default "
  - "go install"
  - "gem install "
  # 下載下來交給 shell 跑的安裝程式（Homebrew 官方那種 bash -c "$(curl …)"）
  - "bash -c *curl "
  - "sh -c *curl "
  - "zsh -c *curl "
  - "bash -c *wget "
  - "sh -c *wget "
# 不是「指令開頭」形式的，原樣加入。
claude_guard_ask_extra:
  # 旗標在套件名稱後面的全域安裝（npm install foo -g）
  - "Bash(npm install * -g*)"
  - "Bash(npm i * -g*)"
  - "Bash(pnpm add * -g*)"
  # `curl … | sh`：管線會拆開逐段比對，以「單獨一個 sh」對上
  - "Bash(sh)"
  - "Bash(bash)"
  - "Bash(zsh)"
  - "Bash(*/sh)"
  - "Bash(*/bash)"
  - "Bash(*/zsh)"
  - "Bash(sh -s*)"
  - "Bash(bash -s*)"
  # 主機的設定檔與 PATH 上的目錄（這些由 IaC 管）。Edit 規則也涵蓋 Write。
  - "Edit(~/.zshenv)"
  - "Edit(~/.zprofile)"
  - "Edit(~/.zshrc)"
  - "Edit(~/.bashrc)"
  - "Edit(~/.bash_profile)"
  - "Edit(~/.profile)"
  - "Edit(~/Library/LaunchAgents/**)"
  - "Edit(~/.local/bin/**)"
  - "Edit(~/bin/**)"
claude_guard_ask: >-
  {{ (['Bash('] | product(claude_guard_ask_commands) | map('join') | map('regex_replace', '$', '*)') | list)
     + (['Bash(*/'] | product(claude_guard_ask_commands) | map('join') | map('regex_replace', '$', '*)') | list)
     + claude_guard_ask_extra }}

# ---- GitHub Actions 自架執行器（tasks/gha-runner.yml）------------------------------
# 放在 podman machine 裡（2026-11-17 Miska 定：先放這台，Mac mini 到了再搬）。repo 層級的執行器，只服務一個 repo。
gha_runner_repo: MiskaWu/jury
gha_runner_name: macbook-pro
gha_runner_labels: [jury]
# 官方 release（github.com/actions/runner/releases），sha256 取自那一版 release 頁上的 linux-arm64 那行。
gha_runner_version: "2.338.2"
gha_runner_sha256: 670adb2f268fe21dcbb58b3db0e0aa9d5b3bddfe2c651481336e561ff86de945
gha_runner_image: localhost/gha-runner
# Docker 引擎（給 jury 的 buildx）。主版號釘住，換版改這裡再 make install TAGS=gha-runner。
gha_runner_docker_image: docker.io/library/docker:29-dind
gha_runner_network: gha-jury
gha_runner_container: gha-jury-runner
gha_runner_docker_container: gha-jury-docker
gha_runner_docker_volume: gha-jury-docker
gha_runner_state_volume: gha-jury-state
gha_runner_label: local.gha-runner

# ---- Godot（tasks/godot.yml）--------------------------------------------------
# 多版本並存：列幾個裝幾個（~/Applications/Godot-<版本>.app），清單上沒有的會被移除。
# 版本寫法同官方 release tag 去掉 -stable：x.y.0 是 "4.7"、之後是 "4.7.2"。
# 要多裝一版就加進清單，在 config.yml 覆蓋即可，例：godot_versions: ["4.6.3", "4.7.2"]。
godot_versions: ["4.7.2"]
godot_default_version: "{{ godot_versions | last }}"
godot_release_url: https://github.com/godotengine/godot/releases/download
godot_app_dir: "{{ mac_node_home }}/Applications"

# ---- Codex CLI（tasks/codex.yml）----------------------------------------------
# OpenAI 官方的 Codex CLI，easel（github.com/MiskaWu/easel）用它生圖。明確 pin：跟 Linux 那台同一版，
# 2026-11-06 和 easel 一起驗過。改版本號再 make install TAGS=codex：裝新版、切 symlink、刪舊版目錄。
codex_version: "0.167.0"
# release tag 是 rust-v<版本>。裝的是完整套件 codex-package-*（官方 install.sh 與 brew cask 裝的也是它），
# 對同一個 release 公布的 codex-package_SHA256SUMS 驗證（同 node、godot）。
# 不能換成只有一個執行檔的 codex-aarch64-apple-darwin.tar.gz：理由見 tasks/codex.yml 檔頭。
codex_release_url: "https://github.com/openai/codex/releases/download/rust-v{{ codex_version }}"
codex_asset: codex-package-aarch64-apple-darwin
codex_checksums_asset: codex-package_SHA256SUMS
# 整包放這裡（同 node 的 ~/.local/node-<版本>），~/.local/bin/codex 是連到裡面 bin/codex 的 symlink。
mac_node_codex_pkg_dir: "{{ mac_node_home }}/.local/codex-{{ codex_version }}"
mac_node_codex_bin: "{{ mac_node_home }}/.local/bin/codex"
# 套件裡一定要有的檔（相對於套件根目錄）。「裝了沒」與「解開後對不對」都看這份。
codex_package_required:
  - bin/codex
  - bin/codex-code-mode-host
  - codex-path/rg
  - codex-package.json

# 下面兩段 bash 是「codex 能不能用」的檢查，安裝後的斷言（tasks/codex.yml）與 make verify 用同一段，
# 不各寫一份 —— 之前的洞就是只看 `codex --version`，沒看 easel 真正要的東西在不在。
#
# (1) 讀版本。codex 每次執行（連 --version）都會在解析參數之前先建出 $CODEX_HOME/tmp/arg0-macos
#     （codex-rs/arg0/src/lib.rs），所以給它一個用完即丟的 CODEX_HOME，不碰 ~/.codex。
mac_node_codex_version_probe: |
  t=$(/usr/bin/mktemp -d) || exit 1
  CODEX_HOME="$t" {{ mac_node_codex_bin | quote }} --version
  rc=$?
  /bin/rm -rf "${t:?}"
  exit $rc
# (2) 照 codex 自己的規則找 codex-code-mode-host（codex-rs/install-context/src/lib.rs）：把執行檔的路徑
#     解到底（symlink 會解開）→ 所在目錄叫 bin、上一層有 codex-package.json 才算套件配置 →
#     先找 codex-resources/codex-code-mode-host，再找 bin/codex-code-mode-host。
#     image_gen 走 code mode，找不到這支就生不了圖。成功印出它的路徑；失敗印原因並 exit 1。
#     最後跑一次 --help：它的 main() 第一步就是解析參數，不會動任何東西，只確認這支真的起得來。
mac_node_codex_host_probe: |
  c={{ mac_node_codex_bin | quote }}
  want={{ mac_node_codex_pkg_dir | quote }}
  real=$(/bin/realpath "$c" 2>/dev/null) || { echo "找不到 ${c}"; exit 1; }
  bin=${real%/*}; pkg=${bin%/*}
  [ "${bin##*/}" = bin ] && [ -f "$pkg/codex-package.json" ] || { echo "codex 不在套件配置裡（${real}）：只有一個執行檔時沒有 codex-code-mode-host，image_gen 會失敗"; exit 1; }
  [ "$pkg" = "$(/bin/realpath "$want" 2>/dev/null)" ] || { echo "codex 連到 ${pkg}，不是 pin 的 ${want}"; exit 1; }
  h="$pkg/codex-resources/codex-code-mode-host"; [ -f "$h" ] || h="$bin/codex-code-mode-host"
  [ -f "$h" ] && [ -x "$h" ] || { echo "沒有可執行的 ${h}：code mode 起不來，image_gen 會失敗"; exit 1; }
  "$h" --help >/dev/null 2>&1 || { echo "${h} 跑不起來"; exit 1; }
  echo "$h"

# ---- chrome-headless-shell（tasks/chrome-headless-shell.yml）--------------------
# Chrome for Testing 的 chrome-headless-shell（舊版的無頭模式），jury 的截圖腳本拍 390 寬的手機截圖用。
# 一般 Google Chrome 的無頭模式最窄 500，手機寬度的圖會被切掉（理由見 tasks/chrome-headless-shell.yml 檔頭）。
#
# 版本：2026-11-16 查 last-known-good-versions.json 的 Stable。
# **Chrome for Testing 沒有公布 checksum**，sha256 是自己下載這一版的 zip 算出來的（shasum -a 256），
# 同時對過 Google Cloud Storage 回的 x-goog-hash（md5）確認下載沒壞。
# **換版本時兩個值要一起改**：只改版本號，下載會因為 sha256 對不上而失敗（不會裝進來）。步驟：
#   1. 查 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json 的 Stable 版本號
#   2. 下載 chrome_headless_shell_url（換成新版本號）那個 zip，shasum -a 256 算出來
#   3. 兩個值一起改，再 make install TAGS=chrome-headless-shell：裝新版、改寫轉接腳本、刪舊版目錄
# 在 config.yml 覆蓋時也一樣，兩個一起寫。
chrome_headless_shell_version: "157.0.8103.78"
chrome_headless_shell_sha256: "17bf66d53c1b1104dcb641c5b331cd4ac5d200c778f5feed0934a0b92deaf8d6"
chrome_headless_shell_asset: chrome-headless-shell-mac-arm64
chrome_headless_shell_url: "https://storage.googleapis.com/chrome-for-testing-public/{{ chrome_headless_shell_version }}/mac-arm64/{{ chrome_headless_shell_asset }}.zip"
# 整包放這裡（同 codex 的 ~/.local/codex-<版本>）。chs = chrome-headless-shell。
mac_node_chs_dir: "{{ mac_node_home }}/.local/chrome-headless-shell-{{ chrome_headless_shell_version }}"
# ~/.local/bin/chrome-headless-shell 是一支轉接腳本，exec 到版本目錄裡的執行檔。**不能用 symlink**：
# 經 symlink 叫時找不到 icudtl.dat，exit 133（2026-11-16 實測，理由見 tasks/chrome-headless-shell.yml 檔頭）。
mac_node_chs_bin: "{{ mac_node_home }}/.local/bin/chrome-headless-shell"
# 轉接腳本第二行的標記，後面接版本。「是不是這裡放的」（安裝時的斷言、移除）只比對這段不含版本的前半。
mac_node_chs_marker: "# mac-bootstrap: chrome-headless-shell"
# zip 外層目錄（chrome-headless-shell-mac-arm64/）裡一定要有的檔。「裝了沒」與「解開後對不對」都看這份。
chrome_headless_shell_required:
  - chrome-headless-shell
  - headless_lib_data.pak
  - icudtl.dat

# 下面兩段 bash 是「chrome-headless-shell 能不能用」的檢查，安裝後的斷言（tasks/chrome-headless-shell.yml）
# 與 make verify 用同一段，不各寫一份（同 codex 的 mac_node_codex_*_probe）。
#
# (1) 讀版本。印「<產品名> <版本>」就結束（157.0.8103.78 的 headless/app/headless_shell.cc：在起瀏覽器之前就
#     printf 後 return），不建設定檔、不碰 ~/Library。也不載入資源：經 symlink 叫時它照樣正常，
#     找不到 icudtl.dat 要靠 (2) 才抓得到。
mac_node_chs_version_probe: |
  {{ mac_node_chs_bin | quote }} --version
# (2) 真的開一次 390 寬的頁面，看版面寬度（innerWidth）是不是 390 —— 截圖腳本要的就是這件事。
#     只看 --version 抓不到「換成一般 Chrome 或之後的版本也有最小寬度」這種情況：一般 Chrome 指定 390 時
#     innerWidth 是 500，不報錯（2026-11-16 實測）。
#     參數照 jury 的 scripts/headless-chrome.sh：用完就刪的 --user-data-dir、--use-mock-keychain（不跳鑰匙圈詢問）。
#     --dump-dom 把 document.documentElement.outerHTML 印到 stdout；頁面用 document.write 把 innerWidth 寫進 body。
#     成功印一行說明；失敗印原因並 exit 1。
mac_node_chs_width_probe: |
  t=$(/usr/bin/mktemp -d) || exit 1
  out=$({{ mac_node_chs_bin | quote }} --headless --user-data-dir="$t" --use-mock-keychain --no-first-run --no-default-browser-check --window-size=390,844 --dump-dom 'data:text/html,<script>document.write(innerWidth)</script>' 2>/dev/null)
  rc=$?
  /bin/rm -rf "${t:?}"
  [ "$rc" -eq 0 ] || { echo "chrome-headless-shell 跑不起來（exit ${rc}）"; exit 1; }
  w=$(printf '%s' "$out" | /usr/bin/sed -n 's#.*<body>\([0-9][0-9]*\)</body>.*#\1#p')
  [ "$w" = 390 ] || { echo "指定 390 寬，innerWidth 卻是 ${w:-讀不到}：手機截圖會被切掉"; exit 1; }
  echo "指定 390 寬，innerWidth 是 390"

# ---- 移除（make uninstall）---------------------------------------------------
# DATA=1 → -e mac_node_uninstall_data=true：連快取、下載的 runtime、VM 磁碟一起刪。
mac_node_uninstall_data: false

# ---- 到家就緒 ----------------------------------------------------------------
arrive_home_apps: []
arrive_home_urls: []

# ---- 漂移檢查（make verify）--------------------------------------------------
# brew 上「允許存在」的頂層套件。多出來的 make verify 會列出來（只報告，不移除）。
# 來源：make 由 bootstrap.sh 裝、ansible 由 Makefile 裝、其餘由各自的 task 檔裝。
# 加一個 brew 套件的 task 時，回來這裡補一行。
mac_node_brew_allowed_formulae: [make, ansible, tmux, go, uv, pnpm, podman, docker-compose, bash, awscli, gh, just]
# claude、google-chrome、chrome-remote-desktop-host：新機器上由 cask-app.yml 裝的（這台是 IaC 之前手動裝的，brew 裡沒有）。
mac_node_brew_allowed_casks: ["{{ mac_node_tailscale_cask }}", claude, google-chrome, chrome-remote-desktop-host]

# brew 以外「允許存在」的東西。比對用 bash 的 glob（可以寫 *）。同樣只報告、不移除。
# 每一行註明是誰裝的。「還沒納入 IaC」的是在 IaC 之前就手動裝好的，之後要收成 tag。
#
# 非 Apple 的 .app（/Applications 與 ~/Applications，比對 bundle id；com.apple.* 不檢查）
mac_node_allowed_apps:
  - io.tailscale.ipn.macsys                   # tailscale（手動 brew --cask，.pkg）
  - com.anthropic.claudefordesktop            # claude-desktop
  - com.google.Chrome                         # chrome
  - com.google.Chrome.app.*                   # Chrome 建的網頁 App（~/Applications/Chrome Apps）
  - com.google.chromeremotedesktop.*          # chrome-remote-desktop（主機附的移除程式）
  - org.godotengine.godot                     # godot（~/Applications/Godot-<版本>.app）
# 非 Apple 的安裝收據（pkgutil --pkgs）
mac_node_allowed_pkgs:
  - com.tailscale.ipn.macsys                  # tailscale
  - com.google.pkg.ChromeRemoteDesktopHost*   # Chrome 遠端桌面主機
  - com.google.pkg.Keystone                   # Google 的自動更新（Chrome 遠端桌面主機帶進來的）
# 開機或登入就會跑的東西：~/Library/LaunchAgents、/Library/LaunchAgents、/Library/LaunchDaemons
# 的 plist（比對檔名，去掉 .plist）
mac_node_allowed_launchd:
  - "{{ claude_rc_label }}"                   # claude-rc
  - "{{ gha_runner_label }}"                  # gha-runner
  - com.google.keystone.*                     # Google 的自動更新（舊版 Keystone）
  - com.google.GoogleUpdater.*                # Google 的自動更新（新版 GoogleUpdater）
  - org.chromium.chromoting*                  # Chrome 遠端桌面主機
# 使用者的執行檔目錄。curl | sh 的安裝程式最常把東西丟在這裡。
mac_node_allowed_user_bins:
  - .local/bin/claude                         # claude
  - .local/bin/cc-jobs                        # claude-config 的 make link 連進來的（背景工作分流表）
  - .local/bin/codex                          # codex（官方 release 的單一執行檔）
  - .local/bin/chrome-headless-shell          # chrome-headless-shell（轉接腳本，exec 到 ~/.local/chrome-headless-shell-<版本>）
  - .local/bin/docker                         # docker-compat（exec podman 的 shim）
  - .local/bin/godot                          # godot
  - .local/bin/godot-*                        # godot（每個版本一個）
  - bin/arrive-home.sh                        # arrive-home
  - bin/claude-rc-server.sh                   # claude-rc
  - bin/claude-rc-entry                       # claude-rc（臨時開關專案的起點）
  - bin/gha-runner-keepalive.sh               # gha-runner
