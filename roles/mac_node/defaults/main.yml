---
# 機器專屬的值（主機名稱、git 身分、公鑰…）不在這裡，在 config.yml（範本 config.example.yml）。
# 這裡只放「每台都一樣」的預設，以及 config.yml 沒填時的退路。

mac_node_home: "{{ ansible_facts.env.HOME }}"
mac_node_brew_prefix: /opt/homebrew
mac_node_brew: "{{ mac_node_brew_prefix }}/bin/brew"

# ---- 電源 -------------------------------------------------------------------
# pmset -c（只管接電源時）。這台的用途是常駐節點：永不睡眠、螢幕 10 分鐘後關、可被網路喚醒。
mac_node_pmset_ac:
  sleep: 0
  disksleep: 0
  displaysleep: 10
  womp: 1
  tcpkeepalive: 1
mac_lid_mode: A

# ---- Claude Code / Remote Control --------------------------------------------
mac_node_claude_bin: "{{ mac_node_home }}/.local/bin/claude"
mac_node_tmux_bin: "{{ mac_node_brew_prefix }}/bin/tmux"
claude_rc_label: local.claude-rc
claude_rc_session: claude-rc
claude_rc_name: home-mac
claude_rc_workdir: ""
claude_rc_spawn: same-dir
claude_rc_log_dir: "{{ mac_node_home }}/Library/Logs"
# 不要讓 Claude 工作階段的環境漏進 Remote Control 伺服器（理由見 CLAUDE.md 地雷）。
# 伺服器用 env -i 起一個乾淨環境，只放行這幾個；PATH 由 zsh -l 讀 ~/.zprofile 重建。
claude_rc_env_passthrough: [HOME, USER, LOGNAME, TMPDIR, SSH_AUTH_SOCK, LANG]

# ---- Tailscale ---------------------------------------------------------------
# GUI 版（Standalone）。cask 名稱會改，換之前先 `brew info --cask <名稱>` 確認。
mac_node_tailscale_cask: tailscale-app

# ---- ssh ---------------------------------------------------------------------
ssh_key_tag: mac
ssh_key_comment: ""
ssh_key_scopes: [github]
ssh_authorized_keys: []
ssh_authorized_keys_revoked: []
# scope → Host 的對應，同 wsl-bootstrap。沒列的原樣當 Host。
mac_node_ssh_scope_hosts:
  github: github.com
  gitlab: gitlab.com
  bitbucket: bitbucket.org

# ---- 語言與容器（research/language-versions.md，Miska 2026-11-12 核准）------------
# 不裝通用版本管理器。專案要的版本由專案自己宣告，交給語言自己的機制下載：
# go.mod 的 toolchain（GOTOOLCHAIN=auto）、uv 的 .python-version、pnpm 的 devEngines.runtime、
# rust-toolchain.toml。主機只放「bootstrap 用的那一份」。
#
# Node：官方 tarball，明確 pin（不支援 latest）。改版本號再 make install TAGS=node，
# ~/.local/node 會切過去，舊版本目錄（連同裡面 npm i -g 裝的）會被清掉。
node_version: "26.13.1"
node_dist_url: "https://nodejs.org/dist/v{{ node_version }}"
# pnpm：關掉 globalShims。不關的話，遠端工作階段可以透過 pnpm 全域裝 Node，
# pnpm 就悄悄變成 Node 的版本管理器（research §7-3）。
pnpm_global_shims: false
# Rust：官方 rustup-init 的參數，同 Linux。--no-modify-path 一定要（rustup 預設會建 ~/.zshenv）。
rust_profile: minimal
rust_components: [rustfmt, clippy]
# podman machine：只建不啟動，用到時才 `podman machine start`（Miska 核准：不開機自動啟動）。
# 配額：64 GB 的機器，給 VM 8 GB。記憶體單位 MiB、磁碟 GiB。
podman_machine_name: podman-machine-default
podman_machine_cpus: 4
podman_machine_memory: 8192
podman_machine_disk: 100

# ---- Godot（tasks/godot.yml）--------------------------------------------------
# 多版本並存：列幾個裝幾個（~/Applications/Godot-<版本>.app），清單上沒有的會被移除。
# 版本寫法同官方 release tag 去掉 -stable：x.y.0 是 "4.7"、之後是 "4.7.2"。
# 要多裝一版就加進清單，在 config.yml 覆蓋即可，例：godot_versions: ["4.6.3", "4.7.2"]。
godot_versions: ["4.7.2"]
godot_default_version: "{{ godot_versions | last }}"
godot_release_url: https://github.com/godotengine/godot/releases/download
godot_app_dir: "{{ mac_node_home }}/Applications"

# ---- 移除（make uninstall）---------------------------------------------------
# DATA=1 → -e mac_node_uninstall_data=true：連快取、下載的 runtime、VM 磁碟一起刪。
mac_node_uninstall_data: false

# ---- 到家就緒 ----------------------------------------------------------------
arrive_home_apps: []
arrive_home_urls: []

# ---- 漂移檢查（make verify）--------------------------------------------------
# brew 上「允許存在」的頂層套件。多出來的 make verify 會列出來（只報告，不移除）。
# 來源：make 由 bootstrap.sh 裝、ansible 由 Makefile 裝、其餘由各自的 task 檔裝。
# 加一個 brew 套件的 task 時，回來這裡補一行。
mac_node_brew_allowed_formulae: [make, ansible, tmux, go, uv, pnpm, podman, docker-compose]
mac_node_brew_allowed_casks: ["{{ mac_node_tailscale_cask }}"]

# brew 以外「允許存在」的東西。比對用 bash 的 glob（可以寫 *）。同樣只報告、不移除。
# 每一行註明是誰裝的。「還沒納入 IaC」的是在 IaC 之前就手動裝好的，之後要收成 tag。
#
# 非 Apple 的 .app（/Applications 與 ~/Applications，比對 bundle id；com.apple.* 不檢查）
mac_node_allowed_apps:
  - io.tailscale.ipn.macsys                   # tailscale（手動 brew --cask，.pkg）
  - com.anthropic.claudefordesktop            # Claude Desktop（手動，還沒納入 IaC）
  - com.google.Chrome                         # Chrome（手動，還沒納入 IaC）
  - com.google.Chrome.app.*                   # Chrome 建的網頁 App（~/Applications/Chrome Apps）
  - com.google.chromeremotedesktop.*          # Chrome 遠端桌面主機附的移除程式（手動，還沒納入 IaC）
  - org.godotengine.godot                     # godot（~/Applications/Godot-<版本>.app）
# 非 Apple 的安裝收據（pkgutil --pkgs）
mac_node_allowed_pkgs:
  - com.tailscale.ipn.macsys                  # tailscale
  - com.google.pkg.ChromeRemoteDesktopHost*   # Chrome 遠端桌面主機
  - com.google.pkg.Keystone                   # Google 的自動更新（Chrome 遠端桌面主機帶進來的）
# 開機或登入就會跑的東西：~/Library/LaunchAgents、/Library/LaunchAgents、/Library/LaunchDaemons
# 的 plist（比對檔名，去掉 .plist）
mac_node_allowed_launchd:
  - "{{ claude_rc_label }}"                   # claude-rc
  - com.google.keystone.*                     # Google 的自動更新（舊版 Keystone）
  - com.google.GoogleUpdater.*                # Google 的自動更新（新版 GoogleUpdater）
  - org.chromium.chromoting*                  # Chrome 遠端桌面主機
# 使用者的執行檔目錄。curl | sh 的安裝程式最常把東西丟在這裡。
mac_node_allowed_user_bins:
  - .local/bin/claude                         # claude
  - .local/bin/docker                         # docker-compat（exec podman 的 shim）
  - .local/bin/godot                          # godot
  - .local/bin/godot-*                        # godot（每個版本一個）
  - bin/arrive-home.sh                        # arrive-home
  - bin/claude-rc-server.sh                   # claude-rc
